        (q*price).toFixed(2),(bxNum(left[s.key])*V.cost(s.key)).toFixed(2)]); }); }));
  put('03_units_by_product_day.csv',r);

  r=[['show_id','show_name','date','rep_id','rep_name'].concat(PMTS.map(p=>p.label),['rep_sale_total'])];
  shows.forEach(sh=>(sh.days||[]).forEach(d=>(d.repSales||[]).forEach(rs=>{
    r.push([sh.id,sh.name,d.date||'',rs.repId||'',V.repName(rs.repId)]
      .concat(PMTS.map(p=>bxNum(rs[p.key]).toFixed(2)),[V.pmtTotal(rs).toFixed(2)])); })));
  put('04_rep_sales.csv',r);

  r=[['rep_id','rep_name','is_self','active','total_earned','total_paid','still_owed']];
  reps.forEach(rp=>{ const e=V.repEarned(rp.id), p=V.repPaid(rp.id);
    r.push([rp.id,rp.name,rp.isSelf?'yes':'no',rp.active?'yes':'no',e.toFixed(2),p.toFixed(2),Math.max(0,e-p).toFixed(2)]); });
  put('05_rep_pay_summary.csv',r);

  r=[['rep_id','rep_name','date','amount','method','note']];
  reps.forEach(rp=>(rp.payments||[]).forEach(p=>r.push([rp.id,rp.name,p.date||'',bxNum(p.amount).toFixed(2),p.method||'',p.note||''])));
  shows.forEach(sh=>(sh.days||[]).forEach(d=>Object.keys(d.repPay||{}).forEach(k=>{
    const amt=V.repDayPay(d,k); if(amt)r.push([k,V.repName(k),d.date||'',amt.toFixed(2),'day-pay','show: '+sh.name]); })));
  shows.forEach(sh=>(sh.workers||[]).forEach(w=>r.push([w.id||'',w.name||'',sh.startDate||'',V.workerPayout(w).toFixed(2),'worker-'+(w.type||''),'show: '+sh.name])));
  put('06_rep_payouts.csv',r);

  r=[['show_id','show_name','booth_cost','payment_date','amount','note','running_balance']];
  shows.forEach(sh=>{ let run=bxNum(sh.boothCost);
    if(!(sh.boothPayments||[]).length){ r.push([sh.id,sh.name,run.toFixed(2),'','','NO PAYMENTS LOGGED',run.toFixed(2)]); return; }
    (sh.boothPayments||[]).forEach(p=>{ run-=bxNum(p.amount);
      r.push([sh.id,sh.name,bxNum(sh.boothCost).toFixed(2),p.date||'',bxNum(p.amount).toFixed(2),p.note||'',run.toFixed(2)]); }); });
  put('07_booth_payments.csv',r);

  r=[['scope','show_id','show_name','date','category','amount','note']];
  shows.forEach(sh=>{
    (sh.showExpenses||[]).forEach(e=>r.push(['show',sh.id,sh.name,e.date||'',e.cat||'',bxNum(e.amount).toFixed(2),e.desc||'']));
    (sh.days||[]).forEach(d=>Object.keys(d.expenses||{}).forEach(k=>{ const v=bxNum(d.expenses[k]);
      if(v)r.push(['day',sh.id,sh.name,d.date||'',k,v.toFixed(2),'']); }));
    if(bxNum(sh.lodging))r.push(['show',sh.id,sh.name,sh.startDate||'','lodging',bxNum(sh.lodging).toFixed(2),'']);
    const sc=V.supplyCost(sh); if(sc)r.push(['auto',sh.id,sh.name,sh.startDate||'','supplies+bags+overhead',sc.toFixed(2),'computed from snapshot settings']);
    const c=V.calcShow(sh); if(c.gasAuto)r.push(['auto',sh.id,sh.name,sh.startDate||'','gas (estimated)',c.gasAuto.toFixed(2),'auto-added, no gas hand-logged']);
    if(c.cardFees)r.push(['auto',sh.id,sh.name,sh.startDate||'','card processing fees',c.cardFees.toFixed(2),'rate '+V.setting('sqFee',0)]);
  });
  (st.otherExpenses||[]).forEach(e=>r.push(['business','','',e.date||'',e.category||'',bxNum(e.amount).toFixed(2),e.note||'']));
  put('08_expenses.csv',r);

  r=[['sku','product','on_hand','unit_cost','sell_price','cost_value','retail_value','borrowed_from_batman']];
  SKUS.forEach(s=>{ const q=bxNum((st.inventory||{})[s.key]);
    r.push([s.key,s.name,q,V.cost(s.key).toFixed(2),V.price(s.key).toFixed(2),
      (q*V.cost(s.key)).toFixed(2),(q*V.price(s.key)).toFixed(2),bxNum((st.batmanBorrow||{})[s.key])]); });
  put('09_inventory.csv',r);

  r=[['type','show_id','show_name','date','sku','qty','from','to','note']];
  shows.forEach(sh=>(sh.days||[]).forEach(d=>SKUS.forEach(s=>{
    const rs=bxNum((d.restock||{})[s.key]), ls=bxNum((d.lost||{})[s.key]);
    if(rs)r.push(['restock',sh.id,sh.name,d.date||'',s.key,rs,'','','mid-show restock']);
    if(ls)r.push(['lost/damaged',sh.id,sh.name,d.date||'',s.key,ls,'','','counted in COGS']); })));
  (st.transfers||[]).forEach(t=>r.push(['transfer','','',t.date||'',t.sku||'',bxNum(t.qty),t.fromName||'',t.toName||'',t.note||'']));
  put('10_inventory_adjustments.csv',r);

  r=[['supplier','original_balance','payment_date','amount','note','remaining']];
  const pd=st.productDebt||{}; let rem=bxNum(pd.originalBalance);
  if(!(pd.payments||[]).length)r.push([pd.supplier||'',rem.toFixed(2),'','','NO PAYMENTS LOGGED',rem.toFixed(2)]);
  (pd.payments||[]).forEach(p=>{ rem-=bxNum(p.amount);
    r.push([pd.supplier||'',bxNum(pd.originalBalance).toFixed(2),p.date||'',bxNum(p.amount).toFixed(2),p.note||'',rem.toFixed(2)]); });
  put('11_product_debt.csv',r);

  r=[['id','name','qty_on_hand','low_threshold','unit','unit_cost']];
  (st.supplies||[]).forEach(s=>r.push([s.id,s.name,bxNum(s.qty),bxNum(s.low),s.unit||'',bxNum(s.cost).toFixed(2)]));
  put('12_supplies.csv',r);

  r=[['show_id','show_name','start_date','confirmed','deposit_or_action_due','hours_verified','notes']];
  shows.forEach(sh=>{ if(!sh.notes&&!sh.depositDue)return;
    r.push([sh.id,sh.name,sh.startDate||'',sh.confirmed===false?'PENDING':'confirmed',sh.depositDue||'',
      sh.hoursVerified?'yes':'no',(sh.notes||'').replace(/\s+/g,' ')]); });
  put('13_notes_and_deadlines.csv',r);

  r=[['setting','value','source']];
  Object.keys(st.settings||{}).forEach(k=>r.push(['settings.'+k,st.settings[k],'snapshot']));
  SKUS.forEach(s=>{ r.push(['price.'+s.key,V.price(s.key).toFixed(2),(st.prices&&st.prices[s.key]!=null)?'snapshot':'SKUS default']);
    r.push(['cost.'+s.key,V.cost(s.key).toFixed(2),(st.costs&&st.costs[s.key]!=null)?'snapshot':'SKUS default']); });
  r.push(['app_version',BX_BUILD.version,'build stamp']);
  r.push(['base_commit',BX_BUILD.baseCommit,'pre-feature production']);
  r.push(['backup_branch',BX_BUILD.backupBranch,'rollback target']);
  r.push(['feature_commit',BX_BUILD.featureCommit,'introduced export module']);
  r.push(['feature_build',BX_BUILD.featureBuild,'module build tag']);
  r.push(['state_schema_v',st.v,'snapshot']);
  put('14_settings_prices_costs.csv',r);

  if(typeof SHOWS_2025!=='undefined'){
    r=[['name','dates','location','days','gross','cogs','booth','other_expenses','stored_net','calculated_net','difference','note']];
    SHOWS_2025.forEach(s=>{ const cn=s.gross-s.cogs-s.booth-s.otherExp;
      r.push([s.name,s.dates,s.location,s.numDays,s.gross,s.cogs,s.booth,s.otherExp,s.net,cn,s.net-cn,s.note||'']); });
    put('15_season_2025.csv',r);
  }

  // 17. effective-date COGS schedule as it stands in this snapshot
  r=[['entry_id','label','effective_from','effective_to','is_latest','sku','unit_cost']];
  (V.schedule()||[]).forEach((e,i,arr)=>{ SKUS.forEach(sk=>{
    r.push([e.id||('entry'+i),e.label||'',e.effectiveFrom||'',e.effectiveTo||'(open)',
      (i===arr.length-1)?'yes':'no',sk.key,bxNum((e.costs||{})[sk.key]).toFixed(2)]); }); });
  r.push(['(cost table)','snapshot costs, governs the current period','','', 'n/a','','']);
  SKUS.forEach(sk=>{ const c=(st.costs||{})[sk.key];
    r.push(['(cost table)','S.costs','','','n/a',sk.key,(c!=null&&c!=='')?bxNum(c).toFixed(2):'(not set)']); });
  put('17_cogs_schedule.csv',r);

  // 18. which cost rule decided each unit, per show day
  r=[['show_id','show_name','day_index','day_date','sku','unit_cost_used','cost_source','schedule_entry']];
  shows.forEach(sh=>(sh.days||[]).forEach((d,di)=>{ if(!V.dayHasCounts(d))return;
    const dk=V.dayKey(sh,di), e=V.entryOn(dk);
    SKUS.forEach(sk=>r.push([sh.id,sh.name,di+1,dk||'(no date)',sk.key,
      V.costOn(sk.key,dk,sh).toFixed(2),V.costSourceOn(sk.key,dk,sh),(e&&e.id)||''])); }));
  if(r.length===1)r.push(['(none)','no show day has both counts, so no COGS was computed','','','','','','']);
  put('18_cost_source_by_day.csv',r);

  // 19. reconciliation preview, read only
  if(meta._recon)F.push({name:'19_reconciliation_preview.csv',
    text:_csvRows([hdr]) +'\r\n'+ bxReconCsv(meta._recon)});

  r=[['source','present','label','updated_at','fingerprint','shows','show_days','reps','selected_for_this_export']];
  ['memory','localStorage','cloud'].forEach(k=>{ const s=(meta._sources||{})[k]||{};
    r.push([k,s.present?'yes':'no',s.label||'',s.updatedAt||'',s.fingerprint||'',
      (s.counts&&s.counts.shows)||'',(s.counts&&s.counts.showDays)||'',(s.counts&&s.counts.reps)||'',
      k===meta.exportSource?'YES':'']); });
  const cmp=meta.comparison||{};
  Object.keys(cmp).forEach(k=>r.push(['comparison: '+k,cmp[k]===null?'unknown':(cmp[k]?'identical':'DIFFERENT'),'','','','','','','']));
  r.push(['cloud status',meta.cloudStatusCode||'',meta.cloudStatus||'','','','','','','']);
  r.push(['captured all copies',meta.capturedAllCopies?'yes':'NO',meta.coverageNote||'','','','','','','']);
  put('16_snapshot_sources.csv',r);
  return F;
}

// ---- Diagnostics. All figures via V, so they describe the SELECTED snapshot. ----
function bxDiagnose(st,snap,meta){
  const V=bxView(st), out=[], shows=st.shows||[], reps=st.reps||[];
  const add=(sev,code,title,items,advice)=>{ if(items.length)out.push({sev,code,title,count:items.length,items,advice}); };
  const nm=sh=>sh.name+(sh.startDate?' ('+sh.startDate+')':'');
  const M=bxMoney;

  add('WARN','MISSING_BOOTH','Shows with no booth cost entered',
    shows.filter(sh=>!bxNum(sh.boothCost)).map(sh=>nm(sh)+' — status '+(sh.confirmed===false?'pending':'confirmed')),
    'Either the booth really is free, or the cost was never entered. A $0 booth makes the show look more profitable than it is.');

  add('WARN','MISSING_MILES','Shows with no mileage entered',
    shows.filter(sh=>!bxNum(sh.miles)).map(sh=>nm(sh)+' — '+(sh.location||'no location')),
    'Zero miles means zero gas cost and zero IRS mileage deduction for that show.');

  const noHours=[];
  shows.forEach(sh=>{ const bad=(sh.days||[]).filter(d=>!d.openTime||!d.closeTime);
    if(bad.length)noHours.push(nm(sh)+' — '+bad.length+' of '+(sh.days||[]).length+' days have no hours'); });
  add('INFO','MISSING_HOURS','Shows with missing daily hours',noHours,'Hours drive the TODAY board and pack planning.');

  add('WARN','UNPAID_BOOTH','Shows with an unpaid booth balance',
    shows.filter(sh=>V.boothBalance(sh)>0.005).map(sh=>nm(sh)+' — owes '+M(V.boothBalance(sh))+
      (sh.depositDue?' by '+sh.depositDue:' (no due date set)')),
    'Money still owed to promoters.');

  const noCogs=[];
  shows.forEach(sh=>(sh.days||[]).forEach(d=>{ const took=V.pmtTotal(d.payments);
    if(took>0&&!V.dayHasCounts(d))
      noCogs.push(nm(sh)+' — '+(d.date||'day '+d.dayNum)+' collected '+M(took)+' with no morning/evening count'); }));
  add('CRITICAL','SALES_NO_COGS','Sales recorded with no COGS',noCogs,
    'Revenue is counted but product cost is not, so profit on these days is overstated. COGS only computes when BOTH the morning and evening counts exist.');

  const repGaps=[];
  shows.forEach(sh=>{ const sellers={};
    (sh.days||[]).forEach(d=>(d.repSales||[]).forEach(rs=>{ if(rs.repId)sellers[rs.repId]=1; }));
    Object.keys(sellers).forEach(id=>{ if(V.repShowPay(sh,id)<=0)
      repGaps.push(nm(sh)+' — '+V.repName(id)+' rang up sales but has no pay recorded'); }); });
  reps.forEach(rp=>{ const e=V.repEarned(rp.id), p=V.repPaid(rp.id);
    if(e-p>0.005)repGaps.push('Rep balance: '+rp.name+' earned '+M(e)+', paid '+M(p)+', still owed '+M(e-p)); });
  add('WARN','REP_PAY_GAP','Rep payouts not recorded or still owed',repGaps,
    'Labor cost missing from a show understates its true cost.');

  const netMismatch=[];
  shows.forEach(sh=>{ if(sh.net==null&&sh.storedNet==null)return;
    const stored=bxNum(sh.net!=null?sh.net:sh.storedNet), c=V.calcShow(sh);
    if(Math.abs(stored-c.profit)>0.005)
      netMismatch.push(nm(sh)+' — stored net '+M(stored)+' vs calculated '+M(c.profit)+' (off by '+M(stored-c.profit)+')'); });
  if(typeof SHOWS_2025!=='undefined'){
    SHOWS_2025.forEach(s=>{ const cn=s.gross-s.cogs-s.booth-s.otherExp;
      if(s.net!==cn)netMismatch.push('2025: '+s.name+' '+s.dates+' — stored net '+M(s.net)+
        ' vs gross minus costs '+M(cn)+' (off by '+M(s.net-cn)+')'); });
  }
  add('CRITICAL','NET_MISMATCH','Stored net does not match calculated net',netMismatch,
    'For 2025 rows the stored net was carried over from the Excel workbook and does not equal gross minus COGS minus booth minus other.');

  const dupes=[], seen={};
  shows.forEach(sh=>{ const k=(sh.name||'').toLowerCase().trim()+'|'+(sh.startDate||'');
    if(seen[k])dupes.push('Exact duplicate: '+nm(sh)+' (ids '+seen[k]+' and '+sh.id+')'); else seen[k]=sh.id; });
  const byName={};
  shows.forEach(sh=>{ const k=(sh.name||'').toLowerCase().trim(); (byName[k]=byName[k]||[]).push(sh); });
  Object.keys(byName).forEach(k=>{ const g=byName[k]; if(g.length<2)return;
    for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){ const a=g[i],b=g[j];
      if(!a.startDate||!b.startDate||a.startDate===b.startDate)continue;
      const as=new Date(a.startDate).getTime(), ae=as+((a.numDays||1)-1)*864e5;
      const bs=new Date(b.startDate).getTime(), be=bs+((b.numDays||1)-1)*864e5;
      if(as<=be&&bs<=ae)dupes.push('Overlapping dates: '+nm(a)+' and '+nm(b)); } });
  const clash={};
  shows.forEach(sh=>{ if(sh.confirmed===false)return; const s0=new Date(sh.startDate).getTime();
    if(!isFinite(s0))return;
    for(let i=0;i<(sh.numDays||1);i++){ const k=new Date(s0+i*864e5).toISOString().slice(0,10);
      (clash[k]=clash[k]||[]).push(sh.name); } });
  Object.keys(clash).sort().forEach(k=>{ if(clash[k].length>1)dupes.push('Two confirmed shows on '+k+': '+clash[k].join(' AND ')); });
  add('WARN','DUPLICATE_SHOWS','Duplicate or conflicting show records',dupes,
    'Two confirmed shows on the same day cannot both be worked unless a rep covers one.');

  const sch=V.schedule(), sv=V.scheduleValidation();
  add('CRITICAL','COGS_SCHEDULE_INVALID','COGS schedule is not valid, so costs fell back',
    sch?sv.errors:[], 'While the schedule is invalid it is ignored entirely and costs fall back to the cost table, then to the product default. Fix the schedule before trusting any COGS figure.');
  add('WARN','COGS_SCHEDULE_GAPS','COGS schedule has gaps or an open end problem',
    sch?sv.warnings:[], 'Sale dates inside a gap are not covered by any period and fall back.');
  const uncovered=[];
  if(sch&&sv.valid)shows.forEach(sh=>(sh.days||[]).forEach((d,di)=>{
    if(!V.dayHasCounts(d))return; const dk=V.dayKey(sh,di);
    if(!V.entryOn(dk))uncovered.push(nm(sh)+' day '+(di+1)+' ('+(dk||'no date')+') is not covered by any schedule period'); }));
  add('CRITICAL','COGS_DATE_UNCOVERED','Selling days with no schedule period',uncovered,
    'These days fell back to the cost table or the product default instead of a dated cost.');
  const schedDrift=[];
  const latest=sch?sch[sch.length-1]:null;
  SKUS.forEach(sk=>{ const t=(st.costs||{})[sk.key];
    if(t!=null&&t!==''&&latest&&latest.costs&&latest.costs[sk.key]!=null&&
       Math.abs(bxNum(t)-bxNum(latest.costs[sk.key]))>0.0001)
      schedDrift.push(sk.name+': cost table '+M(bxNum(t))+' vs newest schedule entry '+M(bxNum(latest.costs[sk.key]))); });
  add('WARN','COGS_TABLE_STALE','Cost table no longer matches the newest schedule entry',schedDrift,
    'The schedule is authoritative, so the table is not used for calculation. It should still be kept in step, and the staged cost-change flow does that automatically.');

  if(snap&&snap.comparison&&meta&&meta._recon&&meta._recon.available){
    const R=meta._recon, items=[];
    R.onlyInLocal.forEach(x=>items.push('Only on this device, not in the cloud: '+x.label));
    R.onlyInCloud.forEach(x=>items.push('Only in the cloud, not on this device: '+x.label));
    R.conflicts.forEach(x=>items.push('Field conflict: '+x.label+' ('+x.diffs.map(d=>d.field).join(', ')+')'));
    add('WARN','RECON_PENDING','Local and cloud copies are not reconciled',items,
      'Preview only. Phase 2A deliberately has no apply, sync, repair, restore or push action. Nothing was written.');
  }

  if(snap&&snap.cloudRead&&snap.cloudRead.status!=='ok'){
    const cs=snap.cloudRead.status;
    const sev=(cs==='error')?'CRITICAL':(cs==='empty'?'WARN':'INFO');
    const why=(cs==='error')
      ? 'Cloud sync is set up but the cloud copy could NOT be retrieved. Data may exist in the cloud that is not in this export. Do not treat this file as a complete backup until a cloud read succeeds.'
      : (cs==='empty')
      ? 'You are signed in but nothing is stored in the cloud yet, so there was no cloud copy to capture. This export covers this device only.'
      : 'You are not signed in to cloud sync, so no cloud copy was captured. This export covers this device only.';
    out.push({sev:sev,code:'CLOUD_NOT_CAPTURED',title:'Cloud copy was not captured — this export is device-only',
      count:1,items:[snap.cloudRead.message],advice:why});
  }
  if(snap&&snap.comparison){
    const drift=[], c=snap.comparison, S_=snap.sources;
    const describe=(a,b,v)=>{ if(v===false)drift.push(a+' and '+b+' are DIFFERENT — '+a+' updated '+
      ((S_[a].updatedAt)||'unknown')+' with '+((S_[a].counts||{}).shows)+' shows; '+b+' updated '+
      ((S_[b].updatedAt)||'unknown')+' with '+((S_[b].counts||{}).shows)+' shows'); };
    describe('memory','localStorage',c.memory_vs_localStorage);
    describe('localStorage','cloud',c.localStorage_vs_cloud);
    describe('memory','cloud',c.memory_vs_cloud);
    add('WARN','SNAPSHOT_DRIFT','The three stored copies do not match',drift,
      'This report was built from "'+(snap.sources[snap.selected].label)+'". The other copies hold different data.');
  }
  return out;
}
function bxDiagCsv(diag,meta){
  const r=[['# source: '+(meta?meta.exportSourceLabel:'')+' | fingerprint: '+(meta?meta.exportSourceFingerprint:'')],
           ['severity','code','issue','detail']];
  diag.forEach(d=>d.items.forEach(i=>r.push([d.sev,d.code,d.title,i])));
  if(r.length===2)r.push(['OK','NONE','No issues found','']);
  return _csvRows(r);
}

// ---- Human readable summary. Every figure via V. ----
function bxSummary(st,meta,diag,snap){
  const V=bxView(st), L=[], line=s=>L.push(s), rule=()=>L.push('='.repeat(66));
  const shows=st.shows||[], M=bxMoney;
  rule(); line('BEST SOLUTION — COMPLETE BUSINESS DATA EXPORT'); line('Dot Dynasty LLC'); rule();
  line('Exported            : '+meta.exportedAt);
  line('');
  if(!meta.capturedAllCopies){
    line('*'.repeat(66));
    line('INCOMPLETE EXPORT — NOT ALL COPIES WERE CAPTURED');
    line('  '+meta.coverageNote);
    line('  Cloud status: '+meta.cloudStatus);
    line('*'.repeat(66));
    line('');
  }else{
    line('COVERAGE: all three copies captured (memory, device, cloud).');
    line('');
  }
  line('SOURCE OF THIS REPORT');
  line('  Every figure below comes from : '+meta.exportSourceLabel);
  line('  That copy last changed        : '+(meta.exportSourceUpdatedAt||'unknown'));
  line('  Fingerprint                   : '+meta.exportSourceFingerprint);
  line('');
  line('BUILD');
  line('  Production app version        : '+meta.appVersion);
  line('  Backup commit (roll back here): '+meta.baseCommit+'  on branch '+meta.backupBranch);
  line('  Export feature commit         : '+meta.featureCommit+'  build '+meta.featureBuild);
  line('  State schema                  : v'+meta.stateSchemaV);
  line('');
  rule(); line('THE THREE STORED COPIES'); rule();

// ===================================================
// PHASE 2A — RECONCILIATION PREVIEW (STRICTLY READ ONLY)
// Compares localStorage against the Supabase cloud copy and reports what a
// reconciliation WOULD do. It writes nothing to either side. There is no
// apply, sync, repair, restore or push action in this phase, by design.
// ===================================================
function bxNormName(n){ return String(n||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function bxShowKey(sh){ return bxNormName(sh&&sh.name)+'|'+((sh&&sh.startDate)||''); }
function bxShowLabel(sh){ return ((sh&&sh.name)||'(unnamed)')+(sh&&sh.startDate?' ('+sh.startDate+')':''); }

// ---- Fields deliberately NOT compared, because they are derived or display-only ----
// dates      : array of display strings rebuilt from startDate + numDays
// days[].date: display string for the same reason
// Everything else persisted on a show IS compared, recursively, to full depth.
const BX_DIFF_EXCLUDE={'dates':'derived display array, rebuilt from startDate and numDays',
                       'days[].date':'derived display string, rebuilt from startDate and day index'};
function bxIsExcluded(path){
  return path==='dates'||/^days\[\d+\]\.date$/.test(path);
}
// Recursive deep diff. Reports a leaf path for every persisted value that differs,
// including values present on one side only.
function bxDeepDiff(a,b,path,out){
  if(bxIsExcluded(path))return;
  const ta=(a===null)?'null':(Array.isArray(a)?'array':typeof a);
  const tb=(b===null)?'null':(Array.isArray(b)?'array':typeof b);
  if(a===undefined&&b===undefined)return;
  if(a===undefined||b===undefined||ta!==tb||ta!=='object'&&ta!=='array'){
    if(JSON.stringify(a===undefined?null:a)!==JSON.stringify(b===undefined?null:b))
      out.push({field:path||'(root)',local:a===undefined?'(absent)':a,cloud:b===undefined?'(absent)':b});
    return;
  }
  if(ta==='array'){
    const n=Math.max(a.length,b.length);
    if(a.length!==b.length)out.push({field:path+'.length',local:a.length,cloud:b.length});
    for(let i=0;i<n;i++)bxDeepDiff(a[i],b[i],path+'['+i+']',out);
    return;
  }
  const keys={}; Object.keys(a||{}).forEach(k=>keys[k]=1); Object.keys(b||{}).forEach(k=>keys[k]=1);
  Object.keys(keys).sort().forEach(k=>bxDeepDiff((a||{})[k],(b||{})[k],path?path+'.'+k:k,out));
}
function bxDiffShow(a,b){ const out=[]; bxDeepDiff(a,b,'',out); return out; }

// ---- ID-FIRST MATCHING ----
// Stable show id is the only trusted key. Normalised name + start date is a
// LABELLED fallback, used only when an id is missing on one side, and only when
// it resolves to exactly one candidate. Anything else is ambiguous and is held
// for human review; it never silently authorises a future merge.
function bxMatchShows(L,C){
  const res={pairs:[],onlyLocal:[],onlyCloud:[],ambiguous:[]};
  const lShows=(L.shows||[]).slice(), cShows=(C.shows||[]).slice();
  const cById={}, cDup={};
  cShows.forEach(sh=>{ if(!sh.id)return; if(cById[sh.id]){cDup[sh.id]=1;} cById[sh.id]=sh; });
  const lById={}, lDup={};
  lShows.forEach(sh=>{ if(!sh.id)return; if(lById[sh.id]){lDup[sh.id]=1;} lById[sh.id]=sh; });
  Object.keys(cDup).forEach(id=>res.ambiguous.push({reason:'duplicate id in cloud',id:id,
    label:bxShowLabel(cById[id]),needsHumanReview:true}));
  Object.keys(lDup).forEach(id=>res.ambiguous.push({reason:'duplicate id in localStorage',id:id,
    label:bxShowLabel(lById[id]),needsHumanReview:true}));
  const usedCloud={};
  lShows.forEach(a=>{
    if(a.id&&cById[a.id]){ usedCloud[a.id]=1;
      res.pairs.push({local:a,cloud:cById[a.id],matchedBy:'id',id:a.id,trusted:true}); }
  });
  const unmatchedLocal=lShows.filter(a=>!(a.id&&cById[a.id]));
  const unmatchedCloud=cShows.filter(b=>!(b.id&&usedCloud[b.id]));
  // Claimed cloud records are tracked in a Set here, never by tagging the record
  // itself: matching is a read of the caller's data and must not write to it.
  const taken=new Set();
  unmatchedLocal.forEach(a=>{
    // Fallback is ONLY permitted when an id is missing on one side. Two records
    // that both carry ids and those ids differ are DIFFERENT records, never
    // merged on a name-and-date coincidence.
    const cands=unmatchedCloud.filter(b=>!taken.has(b)&&bxShowKey(a)===bxShowKey(b)&&(!a.id||!b.id));
    if(cands.length===1){
      taken.add(cands[0]);
      res.pairs.push({local:a,cloud:cands[0],matchedBy:'fallback: normalised name + start date',
        id:a.id||null,trusted:false,
        note:'FALLBACK MATCH, not id-verified. Review before any future merge.'});
    }else if(cands.length>1){
      res.ambiguous.push({reason:'fallback match is ambiguous, '+cands.length+' cloud records share this name and date',
        label:bxShowLabel(a),localId:a.id||null,
        candidates:cands.map(c=>({id:c.id||null,label:bxShowLabel(c)})),needsHumanReview:true});
    }else{
      res.onlyLocal.push(a);
    }
  });
  unmatchedCloud.forEach(b=>{ if(!taken.has(b)&&!res.ambiguous.some(x=>(x.candidates||[]).some(c=>c.id===b.id)))res.onlyCloud.push(b); });
  return res;
}

function bxCountRecords(st){
  const shows=(st&&st.shows)||[]; let days=0,bp=0,se=0;
  shows.forEach(sh=>{ days+=(sh.days||[]).length; bp+=(sh.boothPayments||[]).length; se+=(sh.showExpenses||[]).length; });
  return {shows:shows.length,showDays:days,boothPayments:bp,showExpenses:se,reps:((st&&st.reps)||[]).length};
}

function bxReconcile(snap){
  const L=(snap.sources.localStorage&&snap.sources.localStorage.state)||null;
  const C=(snap.sources.cloud&&snap.sources.cloud.state)||null;
  const out={
    available:!!(L&&C),
    reason:!L?'no localStorage copy available':(!C?('cloud copy not captured: '+((snap.cloudRead&&snap.cloudRead.message)||'unknown')):''),
    base:'localStorage',
    fingerprints:{localStorage:(snap.sources.localStorage||{}).fingerprint||null,
                  cloud:(snap.sources.cloud||{}).fingerprint||null,
                  memory:(snap.sources.memory||{}).fingerprint||null},
    updatedAt:{localStorage:(snap.sources.localStorage||{}).updatedAt||null,
               cloud:(snap.sources.cloud||{}).updatedAt||null,
               memory:(snap.sources.memory||{}).updatedAt||null},
    counts:{localStorage:L?bxCountRecords(L):null, cloud:C?bxCountRecords(C):null},
    onlyInLocal:[], onlyInCloud:[], conflicts:[], identical:[],
    ambiguous:[], fallbackMatches:[], matchSummary:null,
    excludedFields:BX_DIFF_EXCLUDE,
    migrationsOnlyInLocal:[], migrationsOnlyInCloud:[],
    repsOnlyInLocal:[], repsOnlyInCloud:[],
    settingsDiffs:[], inventoryDiffs:[], costTableDiffs:[], scheduleDiffs:[],
    proposal:{wouldAdd:[],wouldChange:[],wouldPreserve:[],wouldRemove:[],blocked:[],needsReview:[]},
    writesPerformed:0
  };
  if(!out.available)return out;

  const M=bxMatchShows(L,C);
  out.matchSummary={byId:M.pairs.filter(p=>p.matchedBy==='id').length,
                    byFallback:M.pairs.filter(p=>p.matchedBy!=='id').length,
                    ambiguous:M.ambiguous.length};
  out.ambiguous=M.ambiguous;
  out.fallbackMatches=[];

  M.onlyLocal.forEach(a=>out.onlyInLocal.push({key:bxShowKey(a),label:bxShowLabel(a),id:a.id||null,
    startDate:a.startDate||'',days:(a.days||[]).length,boothCost:bxNum(a.boothCost),
    boothPayments:(a.boothPayments||[]).length,showExpenses:(a.showExpenses||[]).length,
    confirmed:a.confirmed!==false}));
  M.onlyCloud.forEach(b2=>out.onlyInCloud.push({key:bxShowKey(b2),label:bxShowLabel(b2),id:b2.id||null,
    startDate:b2.startDate||'',days:(b2.days||[]).length,boothCost:bxNum(b2.boothCost)}));

  M.pairs.forEach(pr=>{
    const diffs=bxDiffShow(pr.local,pr.cloud);
    if(!pr.trusted)out.fallbackMatches.push({label:bxShowLabel(pr.local),localId:pr.local.id||null,
      cloudId:pr.cloud.id||null,note:pr.note});
    if(diffs.length){
      out.conflicts.push({key:bxShowKey(pr.local),label:bxShowLabel(pr.local),id:pr.local.id||null,
        matchedBy:pr.matchedBy,trusted:pr.trusted,diffs:diffs});
    }else{
      out.identical.push({label:bxShowLabel(pr.local),id:pr.local.id||null,matchedBy:pr.matchedBy,trusted:pr.trusted});
    }
  });

  const lm=Object.keys(L._applied||{}), cm=Object.keys(C._applied||{});
  out.migrationsOnlyInLocal=lm.filter(k=>!(C._applied||{})[k]);
  out.migrationsOnlyInCloud=cm.filter(k=>!(L._applied||{})[k]);

  const lr={}, cr={};
  (L.reps||[]).forEach(r=>lr[r.id]=r); (C.reps||[]).forEach(r=>cr[r.id]=r);
  out.repsOnlyInLocal=Object.keys(lr).filter(id=>!cr[id]).map(id=>lr[id].name+' ('+id+')');
  out.repsOnlyInCloud=Object.keys(cr).filter(id=>!lr[id]).map(id=>cr[id].name+' ('+id+')');

  const keys=k=>Object.keys(k||{});
  const cmp=(a,b,label,bucket)=>{
    const all={}; keys(a).forEach(k=>all[k]=1); keys(b).forEach(k=>all[k]=1);
    Object.keys(all).sort().forEach(k=>{
      const av=(a||{})[k], bv=(b||{})[k];
      if(JSON.stringify(av===undefined?null:av)!==JSON.stringify(bv===undefined?null:bv))
        bucket.push({field:label+'.'+k,local:av===undefined?null:av,cloud:bv===undefined?null:bv});
    });
  };
  cmp(L.settings,C.settings,'settings',out.settingsDiffs);
  cmp(L.inventory,C.inventory,'inventory',out.inventoryDiffs);
  cmp(L.costs,C.costs,'costs',out.costTableDiffs);
  if(JSON.stringify(L.cogsHistory||null)!==JSON.stringify(C.cogsHistory||null))
    out.scheduleDiffs.push({field:'cogsHistory',local:(L.cogsHistory||[]).length+' entries',cloud:(C.cogsHistory||[]).length+' entries'});

  // PROPOSAL ONLY. Nothing here is executed in Phase 2A.
  out.onlyInLocal.forEach(x=>out.proposal.wouldAdd.push(
    'ADD to cloud: '+x.label+'  ('+x.days+' days, booth '+bxMoney(x.boothCost)+', '+x.boothPayments+' payments)'));
  out.conflicts.forEach(x=>out.proposal.wouldChange.push(
    'CHANGE in cloud: '+x.label+'  ['+x.matchedBy+(x.trusted?'':', NEEDS REVIEW')+']  ('+
    x.diffs.length+' field'+(x.diffs.length===1?'':'s')+': '+
    x.diffs.slice(0,8).map(d=>d.field).join(', ')+(x.diffs.length>8?', +'+(x.diffs.length-8)+' more':'')+')'));
  out.ambiguous.forEach(x=>out.proposal.blocked.push(
    'BLOCKED, human review required: '+(x.label||x.id||'(record)')+'  — '+x.reason));
  out.fallbackMatches.forEach(x=>out.proposal.needsReview.push(
    'FALLBACK MATCH, not id-verified: '+x.label+'  (local id '+(x.localId||'none')+', cloud id '+(x.cloudId||'none')+')'));
  out.identical.forEach(x=>out.proposal.wouldPreserve.push('PRESERVE unchanged: '+x.label));
  out.onlyInCloud.forEach(x=>out.proposal.wouldPreserve.push(
    'PRESERVE cloud-only record, NOT deleted: '+x.label));
  out.migrationsOnlyInLocal.forEach(k=>out.proposal.wouldAdd.push('ADD migration marker to cloud: '+k));
  out.repsOnlyInLocal.forEach(r=>out.proposal.wouldAdd.push('ADD rep to cloud: '+r));
  out.settingsDiffs.concat(out.costTableDiffs,out.inventoryDiffs,out.scheduleDiffs)
    .forEach(d=>out.proposal.wouldChange.push('CHANGE in cloud: '+d.field+'  local='+JSON.stringify(d.local)+'  cloud='+JSON.stringify(d.cloud)));
  return out;
}

function bxReconReport(rec,meta){
  const L=[], line=s=>L.push(s), rule=()=>L.push('='.repeat(66));
  rule(); line('BEST SOLUTION — RECONCILIATION PREVIEW (READ ONLY)'); rule();
  line('Generated      : '+(meta?meta.exportedAt:''));
  line('App version    : '+(meta?meta.appVersion:'')+'   module build: '+(meta?meta.featureBuild:''));
  line('');
  line('NOTHING WAS WRITTEN. This is a preview of what a reconciliation would do.');
  line('Phase 2A has no apply, sync, repair, restore or push-to-cloud action.');
  line('Writes performed this run: '+rec.writesPerformed);
  line('');
  if(!rec.available){ line('Comparison unavailable: '+rec.reason); rule(); return L.join('\r\n'); }
  rule(); line('SOURCE FINGERPRINTS'); rule();
  ['memory','localStorage','cloud'].forEach(k=>
    line('  '+k.padEnd(14)+' '+String(rec.fingerprints[k]||'n/a').padEnd(22)+' updated '+(rec.updatedAt[k]||'unknown')));
  line('');
  rule(); line('RECORD COUNTS'); rule();
  const c=rec.counts;
  line('  '+'metric'.padEnd(18)+'localStorage'.padStart(14)+'cloud'.padStart(10)+'difference'.padStart(13));
  ['shows','showDays','boothPayments','showExpenses','reps'].forEach(k=>{
    const a=c.localStorage[k], b=c.cloud[k];
    line('  '+k.padEnd(18)+String(a).padStart(14)+String(b).padStart(10)+String(a-b>=0?'+'+(a-b):(a-b)).padStart(13));
  });
  line('');
  rule(); line('RECORDS ONLY IN LOCALSTORAGE  ('+rec.onlyInLocal.length+')'); rule();
  if(!rec.onlyInLocal.length)line('  none');
  rec.onlyInLocal.forEach(x=>{ line('  '+x.label);
    line('      '+x.days+' days, booth '+bxMoney(x.boothCost)+', '+x.boothPayments+' booth payments, '+x.showExpenses+' show expenses'); });
  line('');
  rule(); line('RECORDS ONLY IN CLOUD  ('+rec.onlyInCloud.length+')'); rule();
  if(!rec.onlyInCloud.length)line('  none');
  rec.onlyInCloud.forEach(x=>line('  '+x.label+'   ('+x.days+' days)'));
  line('');
  rule(); line('HOW RECORDS WERE MATCHED'); rule();
  const ms=rec.matchSummary||{};
  line('  Matched by stable id        : '+(ms.byId||0));
  line('  Matched by FALLBACK         : '+(ms.byFallback||0)+'   (normalised name + start date)');
  line('  Ambiguous, held for review  : '+(ms.ambiguous||0));
  if((rec.fallbackMatches||[]).length){ line('');
    line('  FALLBACK MATCHES, not id-verified. Review before any future merge:');
    rec.fallbackMatches.forEach(x=>line('      '+x.label+'   local id '+(x.localId||'none')+', cloud id '+(x.cloudId||'none'))); }
  if((rec.ambiguous||[]).length){ line('');
    line('  AMBIGUOUS, HUMAN REVIEW REQUIRED. These are never auto-matched:');
    rec.ambiguous.forEach(x=>{ line('      '+(x.label||x.id||'(record)')+'   '+x.reason);
      (x.candidates||[]).forEach(c=>line('          candidate: '+c.label+'  id '+(c.id||'none'))); }); }
  line('');
  rule(); line('FIELD-LEVEL CONFLICTS  ('+rec.conflicts.length+' shows)'); rule();
  line('  Every persisted value inside a matched show is compared to full depth.');
  line('  Excluded as derived or display only:');
  Object.keys(rec.excludedFields||{}).forEach(k=>line('      '+k+'  —  '+rec.excludedFields[k]));
  line('');
  if(!rec.conflicts.length)line('  none');
  rec.conflicts.forEach(x=>{ line('  '+x.label+'   [matched by '+x.matchedBy+(x.trusted?'':', NEEDS REVIEW')+']');
    x.diffs.forEach(d=>line('      '+String(d.field).padEnd(34)+' local='+JSON.stringify(d.local)+'   cloud='+JSON.stringify(d.cloud))); });
  line('');
  const other=[['Settings',rec.settingsDiffs],['Cost table',rec.costTableDiffs],
               ['Inventory',rec.inventoryDiffs],['COGS schedule',rec.scheduleDiffs]];
  rule(); line('OTHER DIFFERENCES'); rule();
  other.forEach(([n,arr])=>{ line('  '+n+': '+(arr.length?arr.length+' difference(s)':'identical'));
    arr.forEach(d=>line('      '+d.field+'  local='+JSON.stringify(d.local)+'  cloud='+JSON.stringify(d.cloud))); });
  line('  Migration markers only in localStorage: '+(rec.migrationsOnlyInLocal.join(', ')||'none'));
  line('  Migration markers only in cloud:        '+(rec.migrationsOnlyInCloud.join(', ')||'none'));
  line('  Reps only in localStorage:              '+(rec.repsOnlyInLocal.join(', ')||'none'));
  line('  Reps only in cloud:                     '+(rec.repsOnlyInCloud.join(', ')||'none'));
  line('');
  rule(); line('PROPOSED RESULT IF LOCALSTORAGE IS THE OPERATIONAL BASE'); rule();
  line('  This is a proposal. It has NOT been applied.');
  line('');
  line('  WOULD ADD ('+rec.proposal.wouldAdd.length+')');
  if(!rec.proposal.wouldAdd.length)line('    none');
  rec.proposal.wouldAdd.forEach(x=>line('    '+x));
  line('');
  line('  WOULD CHANGE ('+rec.proposal.wouldChange.length+')');
  if(!rec.proposal.wouldChange.length)line('    none');
  rec.proposal.wouldChange.forEach(x=>line('    '+x));
  line('');
  line('  WOULD PRESERVE ('+rec.proposal.wouldPreserve.length+')');
  if(!rec.proposal.wouldPreserve.length)line('    none');
  rec.proposal.wouldPreserve.forEach(x=>line('    '+x));
  line('');
  line('  WOULD REMOVE ('+rec.proposal.wouldRemove.length+')');
  line('    none. Reconciliation never deletes. Cloud-only records are preserved.');
  line('');
  line('  NEEDS REVIEW BEFORE ANY MERGE ('+rec.proposal.needsReview.length+')');
  if(!rec.proposal.needsReview.length)line('    none');
  rec.proposal.needsReview.forEach(x=>line('    '+x));
  line('');
  line('  BLOCKED, HUMAN DECISION REQUIRED ('+rec.proposal.blocked.length+')');
  if(!rec.proposal.blocked.length)line('    none');
  rec.proposal.blocked.forEach(x=>line('    '+x));
  line('');
  rule();
  line('END OF PREVIEW. No data was modified in localStorage, in memory, or in the cloud.');
  rule();
  return L.join('\r\n');
}

function bxReconCsv(rec){
  const r=[['category','record','field','local_value','cloud_value','proposed_action']];
  if(!rec.available){ r.push(['unavailable',rec.reason,'','','','']); return _csvRows(r); }
  rec.onlyInLocal.forEach(x=>r.push(['only_in_localStorage',x.label,'','present','MISSING','would add to cloud']));
  rec.onlyInCloud.forEach(x=>r.push(['only_in_cloud',x.label,'','MISSING','present','would preserve, never delete']));
  rec.conflicts.forEach(x=>x.diffs.forEach(d=>
    r.push(['field_conflict'+(x.trusted?'':'_FALLBACK_MATCH'),x.label,d.field,JSON.stringify(d.local),JSON.stringify(d.cloud),
      x.trusted?'would take localStorage value':'REVIEW: match not id-verified'])));
  (rec.fallbackMatches||[]).forEach(x=>r.push(['fallback_match',x.label,'','local id '+(x.localId||'none'),'cloud id '+(x.cloudId||'none'),'review before any merge']));
  (rec.ambiguous||[]).forEach(x=>r.push(['AMBIGUOUS',x.label||x.id||'(record)','',x.reason,'','BLOCKED, human review required']));
  Object.keys(rec.excludedFields||{}).forEach(k=>r.push(['excluded_field',k,'','','',rec.excludedFields[k]]));
  rec.settingsDiffs.concat(rec.costTableDiffs,rec.inventoryDiffs,rec.scheduleDiffs).forEach(d=>
    r.push(['global_difference','(state)',d.field,JSON.stringify(d.local),JSON.stringify(d.cloud),'would take localStorage value']));
  rec.migrationsOnlyInLocal.forEach(k=>r.push(['migration_marker',k,'','present','MISSING','would add to cloud']));
  rec.migrationsOnlyInCloud.forEach(k=>r.push(['migration_marker',k,'','MISSING','present','would preserve']));
  rec.repsOnlyInLocal.forEach(x=>r.push(['rep_only_local',x,'','present','MISSING','would add to cloud']));
  rec.repsOnlyInCloud.forEach(x=>r.push(['rep_only_cloud',x,'','MISSING','present','would preserve']));
  rec.identical.forEach(x=>r.push(['identical',x.label,'','same','same','would preserve unchanged']));
  return _csvRows(r);
}

// ===================================================
// PHASE 2A — STAGED COST-CHANGE WORKFLOW
// Costs are never edited in place. A change is entered in full, reviewed, and
// only then committed as ONE atomic schedule change: the open period closes the
// day before the new effective date, a new period opens, and the legacy cost
// table is brought into step. Editing one product can never produce six entries.
// ===================================================
let _csDraft=null;

function csFmtDate(k){ if(!/^\d{4}-\d{2}-\d{2}$/.test(k||''))return k||'';
  const d=new Date(k+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function csCurrentEntry(){ const sch=cogsSchedule(S); if(!sch)return null;
  const open=sch.filter(e=>e.effectiveTo==null||e.effectiveTo==='');
  return open.length===1?open[0]:sch[sch.length-1]; }

// Step 1 — collect all six costs plus one effective date. Nothing is saved here.
function csOpen(){
  const cur=csCurrentEntry(), sv=cogsValidate(cogsSchedule(S));
  const today=_todayKey();
  const rows=SKUS.map(sk=>{
    const now=cur&&cur.costs?bxNum(cur.costs[sk.key]):getCost(sk.key);
    return '<div class="fg"><label class="fl">'+sk.name+' &nbsp;<span style="color:var(--muted)">now '+fmt(now)+'</span></label>'+
      '<input class="fi" type="number" step="0.01" min="0" id="cs_'+sk.key+'" value="'+now.toFixed(2)+'"></div>';
  }).join('');
  mOpen('<div class="mh"><div class="mt">💲 Change product costs</div><button class="mx" onclick="mClose()">&times;</button></div>'+
  (sv.valid?'':'<div class="card rb" style="margin-bottom:10px;padding:10px"><div style="font-size:11px;font-weight:900;color:var(--red)">SCHEDULE PROBLEM</div>'+
     '<div style="font-size:11px">'+sv.errors.map(e=>e.replace(/</g,'&lt;')).join('<br>')+'</div></div>')+
  '<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Enter <strong>all six</strong> new costs and the date they take effect. '+
  'Nothing is saved until you review and confirm on the next screen. Past periods are never touched.</div>'+
  '<div class="fg"><label class="fl">New costs take effect on</label>'+
  '<input class="fi" type="date" id="cs_date" value="'+today+'"></div>'+
  '<div style="font-size:11px;color:var(--muted);margin:-6px 0 12px">The period running now will be closed on the day before this date.</div>'+
  rows+
  '<button class="btn btn-gold btn-full" style="margin-top:6px" onclick="csReview()">Review this change →</button>'+
  '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="mClose()">Cancel</button>');
}

// Step 2 — show the complete proposed change. Still nothing saved.
function csReview(){
  const dk=(($$('cs_date')||{}).value)||'';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dk)){toast('Pick a valid effective date');return;}
  const cur=csCurrentEntry();
  if(cur){
    const f=cur.effectiveFrom||'';
    if(dk<=f){toast('The new date must be after '+csFmtDate(f)+', when the current period started');return;}
  }
  const costs={}; let bad=null;
  SKUS.forEach(sk=>{ const raw=(($$('cs_'+sk.key)||{}).value);
    if(raw===''||raw==null){bad=bad||sk.name+' is blank';return;}
    const n=parseFloat(raw);
    if(!isFinite(n)){bad=bad||sk.name+' is not a number';return;}
    if(n<0){bad=bad||sk.name+' is negative';return;}
    costs[sk.key]=Math.round(n*100)/100; });
  if(bad){toast('All six costs are required: '+bad);return;}
  _csDraft={effectiveFrom:dk,costs:costs,closesPrevOn:cur?cogsDayBefore(dk):null,prevId:cur?cur.id:null};
  const changed=SKUS.filter(sk=>{ const now=cur&&cur.costs?bxNum(cur.costs[sk.key]):getCost(sk.key);
    return Math.abs(now-costs[sk.key])>0.0001; });
  const rows=SKUS.map(sk=>{
    const now=cur&&cur.costs?bxNum(cur.costs[sk.key]):getCost(sk.key), nw=costs[sk.key];
    const moved=Math.abs(now-nw)>0.0001;
    return '<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)">'+
      '<span'+(moved?' style="font-weight:800"':'')+'>'+sk.name+'</span>'+
      '<span>'+fmt(now)+' <span style="color:var(--muted)">&rarr;</span> <strong style="color:'+(moved?'var(--gold)':'var(--muted)')+'">'+fmt(nw)+'</strong></span></div>';
  }).join('');
  mOpen('<div class="mh"><div class="mt">Review cost change</div><button class="mx" onclick="mClose()">&times;</button></div>'+
  '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px">WHAT WILL HAPPEN</div>'+
    (cur?'<div style="font-size:12px;padding:3px 0">Close <strong>'+(cur.label||cur.id)+'</strong> on <strong>'+csFmtDate(_csDraft.closesPrevOn)+'</strong></div>':'')+
    '<div style="font-size:12px;padding:3px 0">Open a new period starting <strong>'+csFmtDate(dk)+'</strong></div>'+
    '<div style="font-size:12px;padding:3px 0">Update the cost table to match the new period</div>'+
    '<div style="font-size:12px;padding:3px 0;color:var(--muted)">All six products are saved together as one change</div>'+
  '</div>'+
  '<div class="card" style="margin-bottom:10px">'+
    '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:700;margin-bottom:6px">COSTS ('+changed.length+' changing)</div>'+rows+'</div>'+
  '<div class="card" style="margin-bottom:12px;border-color:rgba(255,215,0,0.4)">'+
    '<div style="font-size:11px">Sales <strong>on or after '+csFmtDate(dk)+'</strong> will use the new costs. '+
    'Sales before that date keep the costs they already had. Existing history is not rewritten.</div></div>'+
  '<button class="btn btn-gold btn-full" onclick="csCommit()">✔ Confirm and save this change</button>'+
  '<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="csOpen()">← Back to edit</button>');
}

// Step 3 — commit atomically. One saveS(), one audit record.
function csCommit(){
  if(!_csDraft){toast('Nothing to save');return;}
  const d=_csDraft;
  const sch=(S.cogsHistory&&S.cogsHistory.length)?JSON.parse(JSON.stringify(S.cogsHistory)):[];
  const before=JSON.parse(JSON.stringify(sch));
  const openIdx=sch.map((e,i)=>({e,i})).filter(x=>x.e.effectiveTo==null||x.e.effectiveTo==='').map(x=>x.i);
  if(openIdx.length===1)sch[openIdx[0]].effectiveTo=d.closesPrevOn;
  else if(sch.length)sch[sch.length-1].effectiveTo=d.closesPrevOn;
  const id='cogs_'+d.effectiveFrom.replace(/-/g,'_');
  sch.push({id:id,effectiveFrom:d.effectiveFrom,effectiveTo:null,
    label:'Effective '+csFmtDate(d.effectiveFrom),costs:JSON.parse(JSON.stringify(d.costs))});
  const check=cogsValidate(sch);
  if(!check.valid){ toast('Not saved: '+check.errors[0]); return; }
  S.cogsHistory=sch;
  S.costs=S.costs||{}; SKUS.forEach(sk=>S.costs[sk.key]=d.costs[sk.key]);
  S.cogsAudit=S.cogsAudit||[];
  S.cogsAudit.push({at:new Date().toISOString(),action:'add-schedule-entry',appVersion:APP_VERSION,
    entryId:id,effectiveFrom:d.effectiveFrom,closedPrevOn:d.closesPrevOn,
    costs:JSON.parse(JSON.stringify(d.costs)),scheduleBefore:before});
  _csDraft=null;
  saveS(); mClose(); toast('✅ Cost change saved, effective '+csFmtDate(d.effectiveFrom));
  rSettings();
}

// Correcting a mistake: explicit, confirmed, and audited. Only the newest entry.
function csUndoLast(){
  const sch=(S.cogsHistory||[]);
  if(sch.length<2){toast('There is only the original period, nothing to undo');return;}
  const last=sch[sch.length-1];
  if(!confirm('Remove the most recent cost period?\n\n'+(last.label||last.id)+'\nstarting '+csFmtDate(last.effectiveFrom)+
    '\n\nThe previous period will be reopened. This is recorded in the cost change log.'))return;
  const before=JSON.parse(JSON.stringify(sch));
  const next=sch.slice(0,-1);
  next[next.length-1].effectiveTo=null;
  const check=cogsValidate(next);
  if(!check.valid){toast('Not removed: '+check.errors[0]);return;}
  S.cogsHistory=next;
  const nowOpen=next[next.length-1];
  S.costs=S.costs||{}; SKUS.forEach(sk=>S.costs[sk.key]=bxNum((nowOpen.costs||{})[sk.key]));
  S.cogsAudit=S.cogsAudit||[];
  S.cogsAudit.push({at:new Date().toISOString(),action:'remove-newest-entry',appVersion:APP_VERSION,
    removedEntryId:last.id,removedEffectiveFrom:last.effectiveFrom,reopened:nowOpen.id,scheduleBefore:before});
  saveS(); toast('Removed. '+(nowOpen.label||nowOpen.id)+' is open again.'); rSettings();
}

// Settings card: the full history, always visible, with the audited actions.
function csHistoryCard(){
  const sch=cogsSchedule(S), sv=cogsValidate(sch);
  const audit=(S.cogsAudit||[]);
  const rows=(sch||[]).map((e,i,arr)=>{
    const open=(e.effectiveTo==null||e.effectiveTo==='');
    return '<div style="padding:7px 0;border-bottom:1px solid var(--border)">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
      '<span style="font-weight:800;font-size:12px">'+(e.label||e.id)+(open?' <span style="color:var(--green)">● now</span>':'')+'</span>'+
      '<span style="font-size:10px;color:var(--muted)">'+csFmtDate(e.effectiveFrom)+' to '+(open?'now':csFmtDate(e.effectiveTo))+'</span></div>'+
      '<div style="font-size:10px;color:var(--muted);margin-top:3px">'+
        SKUS.map(sk=>sk.short+' '+fmt(bxNum((e.costs||{})[sk.key]))).join(' &nbsp;·&nbsp; ')+'</div></div>';
  }).join('');
  return '<div class="card" style="border-color:rgba(255,215,0,0.35)">'+
  '<div style="font-size:10px;color:var(--gold);text-transform:uppercase;font-weight:700;margin-bottom:8px">💲 COST HISTORY (drives all COGS)</div>'+
  (sch?'':'<div style="font-size:12px;color:var(--red);margin-bottom:8px">No schedule present. Costs fall back to the table below.</div>')+
  (sv.valid?'':'<div class="card rb" style="padding:8px;margin-bottom:8px"><div style="font-size:11px;font-weight:900;color:var(--red)">SCHEDULE INVALID, COSTS ARE FALLING BACK</div>'+
    '<div style="font-size:11px">'+sv.errors.slice(0,4).map(x=>x.replace(/</g,'&lt;')).join('<br>')+'</div></div>')+
  (sv.warnings.length?'<div style="font-size:11px;color:var(--gold);margin-bottom:8px">'+sv.warnings.map(x=>x.replace(/</g,'&lt;')).join('<br>')+'</div>':'')+
  (rows||'')+
  '<button class="btn btn-gold btn-full btn-sm" style="margin-top:10px" onclick="csOpen()">Change costs from a date</button>'+
  ((sch&&sch.length>1)?'<button class="btn btn-ghost btn-full btn-sm" style="margin-top:6px" onclick="csUndoLast()">Remove the newest period</button>':'')+
  (audit.length?'<div style="font-size:10px;color:var(--muted);margin-top:8px">Cost change log: '+audit.length+' recorded change'+(audit.length===1?'':'s')+
    ', newest '+(audit[audit.length-1].at||'').slice(0,10)+'</div>':'')+
  '<div style="font-size:10px;color:var(--muted);margin-top:6px">The schedule is authoritative. COGS uses the costs in force on the date of each sale.</div>'+
  '</div>';
}

function bxShowModal(){

  const crit=sev('CRITICAL'), warn=sev('WARN'), info=sev('INFO');
