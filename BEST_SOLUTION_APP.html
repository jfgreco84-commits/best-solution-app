<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>Best Solution | Dot Dynasty LLC</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0a0a;--card:#161616;--card2:#1e1e1e;--card3:#262626;
      --gold:#FFD700;--gold2:#c9a900;--goldbg:rgba(255,215,0,0.08);--goldbd:rgba(255,215,0,0.25);
      --green:#00D26A;--greenbg:rgba(0,210,106,0.08);--greenbd:rgba(0,210,106,0.25);
      --red:#FF4545;--redbg:rgba(255,69,69,0.08);--redbd:rgba(255,69,69,0.25);
      --blue:#4FC3F7;--text:#f0f0f0;--muted:#777;--border:#252525;
    }
    html,body{height:100%;overflow:hidden}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,sans-serif;font-size:15px}

    /* HEADER */
    #hdr{background:var(--card);border-bottom:2px solid var(--gold);padding:0 16px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;height:52px}
    .hdr-brand{display:flex;align-items:center;gap:8px}
    .hdr-logo{font-size:22px}
    .hdr-name{font-size:16px;font-weight:900;color:var(--gold);letter-spacing:0.3px}
    .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:-1px}

    /* BOTTOM NAV */
    #nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;height:58px}
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:none;background:none;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:0.4px;gap:2px;transition:color 0.15s;position:relative}
    .nb .ni{font-size:18px;line-height:1}
    .nb-badge{position:absolute;top:6px;right:calc(50% - 14px);background:var(--red);color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:1px 4px;line-height:1.4;min-width:14px;text-align:center}
    .nb.on{color:var(--gold)}

    /* PAGES */
    #pages{position:fixed;top:52px;bottom:58px;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .pg{display:none;padding:12px 12px 16px;min-height:100%}
    .pg.on{display:block}

    /* SECTION LABELS */
    .sec-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin:14px 0 8px}
    .sec-lbl:first-child{margin-top:2px}
    .sec-row{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px}
    .sec-row .sec-lbl{margin:0}
    .sec-title{font-size:16px;font-weight:900}

    /* CARDS */
    .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
    .card.gb{border-color:var(--goldbd)}
    .card.grb{border-color:var(--greenbd)}
    .card.rb{border-color:var(--redbd)}
    .card.bb{border-color:rgba(79,195,247,0.3)}

    /* STAT GRIDS */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .sbox{background:var(--card);border-radius:10px;padding:11px 12px;border:1px solid var(--border)}
    .sbox.gb{border-color:var(--goldbd);background:var(--goldbg)}
    .sbox.grb{border-color:var(--greenbd);background:var(--greenbg)}
    .sbox.rb{border-color:var(--redbd);background:var(--redbg)}
    .sl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;margin-bottom:4px}
    .sv{font-size:20px;font-weight:900;color:var(--gold);line-height:1}
    .sv.g{color:var(--green)}.sv.r{color:var(--red)}.sv.w{color:var(--text)}.sv.sm{font-size:16px}
    .ss{font-size:10px;color:var(--muted);margin-top:3px}

    /* PROGRESS BAR */
    .pbar-wrap{background:var(--card3);border-radius:4px;height:7px;overflow:hidden;margin-top:7px}
    .pbar-fill{height:100%;border-radius:4px;transition:width 0.4s}

    /* BUTTONS */
    .btn{padding:11px 16px;border-radius:9px;border:none;cursor:pointer;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity 0.12s,transform 0.1s;letter-spacing:0.2px}
    .btn:active{opacity:0.75;transform:scale(0.97)}.btn:disabled{opacity:0.35;cursor:not-allowed}
    .btn-gold{background:var(--gold);color:#000}.btn-green{background:var(--green);color:#000}
    .btn-red{background:var(--red);color:#fff}.btn-ghost{background:var(--card2);border:1px solid var(--border);color:var(--text)}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-sm{padding:8px 13px;font-size:12px;border-radius:7px}.btn-xs{padding:6px 10px;font-size:11px;border-radius:6px}
    .btn-full{width:100%}

    /* INVENTORY TABLE */
    .inv-table{width:100%;border-collapse:collapse}
    .inv-table th{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700;padding:0 6px 8px;text-align:right}
    .inv-table th:first-child{text-align:left}
    .inv-table td{padding:8px 6px;border-top:1px solid var(--border);font-size:13px;text-align:right;font-weight:600}
    .inv-table td:first-child{text-align:left}
    .inv-table tr:last-child td{border-bottom:1px solid var(--border)}

    /* SHOW CARDS */
    .sc{background:var(--card);border-radius:12px;padding:13px;margin-bottom:9px;border:1px solid var(--border);cursor:pointer}
    .sc.sa{border-color:var(--goldbd)}.sc.sd{opacity:0.8}
    .sc-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px}
    .sc-badge.planned{background:var(--card2);color:var(--muted)}
    .sc-badge.active{background:var(--goldbg);color:var(--gold)}
    .sc-badge.completed{background:var(--greenbg);color:var(--green)}
    .sc-name{font-size:17px;font-weight:900}
    .sc-loc{font-size:11px;color:var(--muted);margin-top:2px}
    .sc-stats{display:flex;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
    .sc-s .sv2{font-size:16px;font-weight:900;color:var(--gold)}.sc-s .sl2{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}

    /* FORMS */
    .fg{margin-bottom:11px}
    .fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px;display:block;font-weight:700}
    .fi{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;color:var(--text);font-size:16px;outline:none}
    .fi:focus{border-color:var(--gold)}
    textarea.fi{min-height:70px;resize:vertical}

    /* MODAL */
    #mo{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:flex-end;justify-content:center}
    #mo.on{display:flex}
    #mb{background:#181818;border-radius:20px 20px 0 0;padding:18px 14px 28px;width:100%;max-width:560px;max-height:91vh;overflow-y:auto;border-top:2px solid var(--gold)}
    .mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:13px}
    .mt{font-size:18px;font-weight:900;color:var(--gold)}
    .mx{background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1;padding:0 4px;margin-top:-4px}

    /* COUNT ROWS */
    .cr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
    .cr:last-child{border-bottom:none}
    .cr-i{flex:1;min-width:0}
    .cr-n{font-size:14px;font-weight:700}
    .cr-s{font-size:11px;color:var(--muted);margin-top:1px}
    .cr-c{display:flex;align-items:center;gap:7px}
    .crb{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:300}
    .crb:active{background:var(--gold);color:#000;border-color:var(--gold)}
    .cri{width:62px;text-align:center;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:7px 4px;color:var(--text);font-size:18px;font-weight:900;outline:none}
    .cri:focus{border-color:var(--gold)}

    /* MONEY */
    .mr{display:flex;align-items:center;gap:10px;margin-bottom:9px}
    .mi{flex:1;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:18px;font-weight:700;outline:none}
    .mi:focus{border-color:var(--gold)}

    /* SUM ROWS */
    .sr{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
    .sr:last-child{border-bottom:none}
    .srl{font-size:14px;color:var(--muted)}
    .srl.b{color:var(--text);font-weight:800;font-size:15px}
    .srv{font-size:14px;font-weight:700}
    .srv.gold{color:var(--gold)}.srv.green{color:var(--green)}.srv.red{color:var(--red)}.srv.lg{font-size:18px}

    /* CHIPS */
    .chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--border)}
    .chip.gold{background:var(--goldbg);color:var(--gold);border-color:var(--goldbd)}
    .chip.green{background:var(--greenbg);color:var(--green);border-color:var(--greenbd)}
    .chip.red{background:var(--redbg);color:var(--red);border-color:var(--redbd)}

    /* DAY TABS */
    .dtabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:13px;scrollbar-width:none}
    .dtabs::-webkit-scrollbar{display:none}
    .dtab{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;background:var(--card2);border:1px solid var(--border);color:var(--muted);transition:all 0.12s}
    .dtab.on{background:var(--gold);color:#000;border-color:var(--gold)}
    .dtab.done{border-color:var(--greenbd);color:var(--green)}

    /* STEP */
    .step{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
    .step:last-child{border-bottom:none}
    .si{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
    .si.done{background:var(--greenbg)}.si.pend{background:var(--card2)}.si.act{background:var(--goldbg)}
    .sn{font-size:14px;font-weight:800}
    .ss2{font-size:11px;color:var(--muted);margin-top:1px}

    /* WARN BOXES */
    .wb{padding:9px 12px;border-radius:8px;font-size:12px;font-weight:600}
    .wb.red{background:var(--redbg);color:var(--red);border:1px solid var(--redbd)}
    .wb.green{background:var(--greenbg);color:var(--green);border:1px solid var(--greenbd)}
    .wb.gold{background:var(--goldbg);color:var(--gold);border:1px solid var(--goldbd)}

    /* DIVIDER */
    .div{height:1px;background:var(--border);margin:12px 0}

    /* TOAST */
    #toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold);color:var(--text);padding:8px 18px;border-radius:9px;font-size:13px;font-weight:700;z-index:400;display:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,0.6)}

    /* HORIZONTAL MINI BAR (payment split) */
    .hbar{height:10px;border-radius:5px;overflow:hidden;display:flex;margin-top:5px;gap:1px}
    .hbar-seg{height:100%;transition:width 0.4s}

    /* EMPTY */
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .empty .ei{font-size:50px;margin-bottom:12px}

    /* CALENDAR */
    .cal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
    .cal-nav-btn{width:36px;height:36px;border-radius:9px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .cal-nav-btn:active{background:var(--gold);color:#000}
    .cal-title{font-size:18px;font-weight:900;color:var(--gold)}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .cal-dow{font-size:10px;color:var(--muted);text-align:center;font-weight:800;letter-spacing:1px;padding:6px 0;text-transform:uppercase}
    .cal-cell{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:7px;padding:4px;position:relative;min-height:46px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden}
    .cal-cell.blank{background:transparent;border:none;padding:0;cursor:default}
    .cal-cell.today{border-color:var(--gold);background:var(--goldbg)}
    .cal-cell.has-show{cursor:pointer}
    .cal-cell.confirmed{background:rgba(0,210,106,0.18);border-color:var(--green)}
    .cal-cell.possible{background:rgba(255,215,0,0.16);border-color:var(--gold)}
    .cal-cell.completed{background:rgba(0,210,106,0.30);border-color:var(--green)}
    .cal-cell.conflict{border-color:var(--red)!important;box-shadow:inset 0 0 0 2px rgba(255,60,60,0.75)}
    .cal-num{font-size:11px;font-weight:800;color:var(--text)}
    .cal-cell.today .cal-num{color:var(--gold)}
    .cal-cell.confirmed .cal-num,.cal-cell.completed .cal-num{color:var(--green)}
    .cal-cell.possible .cal-num{color:var(--gold)}
    .cal-show-pill{font-size:10px;font-weight:800;line-height:1.1;margin-top:2px;padding:1px 3px;border-radius:3px;background:rgba(0,0,0,0.35);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .cal-legend{display:flex;gap:14px;justify-content:center;margin-top:12px;font-size:11px;flex-wrap:wrap}
    .cal-legend-dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:middle}

    /* CONFIRMED BORDERS for show cards */
    .sc.confirmed{border-color:var(--greenbd)}
    .sc.possible{border-color:var(--goldbd);background:rgba(255,215,0,0.04)}

    /* BOOTH PAYMENTS */
    .pay-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:8px}
    .pay-row:last-child{border-bottom:none}
    .pay-amount{font-size:14px;font-weight:900;color:var(--green)}
    .pay-meta{font-size:10px;color:var(--muted)}

    ::-webkit-scrollbar{width:0;height:0}
  .clps{border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:12px;padding:0 14px}
.clps>summary{cursor:pointer;list-style:none;padding:13px 0;font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:0.5px;display:flex;justify-content:space-between;align-items:center}
.clps>summary::-webkit-details-marker{display:none}
.clps>summary::after{content:'▸';color:var(--gold);font-size:14px}
.clps[open]>summary::after{content:'▾'}
.clps .card{border:none;background:none;padding-left:0;padding-right:0;margin-bottom:8px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

  <div style="display:flex;align-items:center;gap:10px"><span id="syncDot" onclick="go('settings')" title="Cloud sync — tap for details" style="width:10px;height:10px;border-radius:50%;background:#666;display:inline-block;cursor:pointer;flex-shrink:0"></span><div id="hdrR"></div></div>

<div id="pages">
  <div id="pg-home" class="pg on"></div>

  <div id="pg-shows" class="pg"></div>

<div id="nav">

<!-- TOAST -->
<div id="toast"></div>

<script>
// ===================================================
// CONFIG
// ===================================================
const SKUS=[
  {key:'32oz',name:'32oz Best Solution',short:'32oz',emoji:'🫙',cost:6.00,defP:25.00},
  {key:'16oz',name:'16oz Best Solution',short:'16oz',emoji:'🫙',cost:4.50,defP:20.00},
  {key:'8oz', name:'8oz Best Solution', short:'8oz', emoji:'🧴',cost:4.00,defP:15.00},
  {key:'2oz', name:'2oz Best Solution', short:'2oz', emoji:'🧴',cost:2.25,defP:8.00},
  {key:'c5s', name:'C5 Small (2oz)',    short:'C5-S',emoji:'✨',cost:3.00,defP:10.00},
  {key:'c5l', name:'C5 Large (8oz)',    short:'C5-L',emoji:'✨',cost:6.00,defP:20.00}
];
// COMM_CARD / COMM_CASH below are the TAX-base rates only (PMTS[].commRate). Do not repurpose for rep commission.
// ===================================================
// PHASE 2A — APP VERSION + EFFECTIVE-DATE COGS SCHEDULE
// ===================================================
// APP_VERSION is the PRODUCTION APP version. It advances only when app
// behaviour changes. Module build tags (e.g. BX_BUILD.featureBuild) are
// separate and must never be conflated with it. A ?v=NN on the page URL is
// a browser cache-buster and is neither of these.
const APP_VERSION='v30';

// Unit costs changed on 2026-08-01. Every COGS figure must use the schedule
// that was in force on the date of the sale, not today's cost table.
// Entries are ordered oldest first. effectiveFrom is inclusive.
const COGS_SCHEDULE_DEFAULT=[
  {id:'cogs_historical', effectiveFrom:'1900-01-01', effectiveTo:'2026-07-31',
   label:'Historical (through Jul 31 2026)',
   costs:{'32oz':6.00,'16oz':4.50,'8oz':4.00,'2oz':2.25,'c5s':3.00,'c5l':6.00}},
  {id:'cogs_current_2026_08', effectiveFrom:'2026-08-01', effectiveTo:null,
   label:'Current (from Aug 1 2026)',
   costs:{'32oz':4.50,'16oz':3.75,'8oz':3.25,'2oz':2.00,'c5s':2.80,'c5l':5.84}}
];
function cogsSchedule(st){ const a=((st||(typeof S!=='undefined'?S:null))||{}).cogsHistory;
  return (a&&a.length)?a:null; }
function cogsIsoKey(v){ return (typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v))?v:null; }
function cogsDayBefore(k){ const d=new Date(k+'T12:00:00'); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }

// ---- SCHEDULE VALIDATION ----
// A schedule is only authoritative if it is provably unambiguous. Anything less
// raises a CRITICAL diagnostic instead of silently picking a number.
function cogsValidate(sch){
  const errors=[], warnings=[];
  if(!sch||!sch.length)return{valid:false,errors:['no schedule present'],warnings:warnings};
  let prev=null;
  sch.forEach((e,i)=>{
    const tag='entry '+(i+1)+' ('+(e&&e.id||'no id')+')';
    if(!e||typeof e!=='object'){errors.push(tag+': not an object');return;}
    const f=cogsIsoKey(e.effectiveFrom);
    if(!f)errors.push(tag+': effectiveFrom is not a valid ISO date');
    const t=(e.effectiveTo==null||e.effectiveTo==='')?null:cogsIsoKey(e.effectiveTo);
    if(e.effectiveTo!=null&&e.effectiveTo!==''&&!t)errors.push(tag+': effectiveTo is not a valid ISO date');
    if(f&&t&&t<f)errors.push(tag+': effectiveTo '+t+' is before effectiveFrom '+f);
    SKUS.forEach(sk=>{ const v=(e.costs||{})[sk.key];
      if(v==null||v==='')errors.push(tag+': missing cost for '+sk.key);
      else{ const n=parseFloat(v);
        if(!isFinite(n))errors.push(tag+': cost for '+sk.key+' is not a number');
        else if(n<0)errors.push(tag+': cost for '+sk.key+' is negative'); } });
    if(prev){
      const pf=cogsIsoKey(prev.effectiveFrom), pt=(prev.effectiveTo==null||prev.effectiveTo==='')?null:cogsIsoKey(prev.effectiveTo);
      if(pf&&f&&f<=pf)errors.push(tag+': out of chronological order, starts on or before the previous entry');
      if(pt===null)errors.push(tag+': follows an open-ended entry, so the periods overlap');
      else if(pt&&f){
        if(f<=pt)errors.push(tag+': overlaps the previous period, which ends '+pt);
        else if(cogsDayBefore(f)!==pt)warnings.push(tag+': gap between '+pt+' and '+f+', dates in that gap have no schedule');
      }
    }

  const open=sch.filter(e=>e.effectiveTo==null||e.effectiveTo==='');
  if(open.length===0)warnings.push('no open-ended entry, so dates after the last period end have no schedule');
  if(open.length>1)errors.push('more than one open-ended entry, so the current period is ambiguous');
  else if(open.length===1&&open[0]!==sch[sch.length-1])errors.push('the open-ended entry is not the newest entry');

function cogsIsValid(st){ return cogsValidate(cogsSchedule(st)).valid; }

// The entry covering a date, honouring BOTH effectiveFrom and effectiveTo.
// Null when the schedule is invalid or the date is not covered.
function cogsEntryOn(dateKey,st){
  const sch=cogsSchedule(st); if(!sch)return null;
  if(!cogsValidate(sch).valid)return null;
  const k=cogsIsoKey(dateKey);
  if(!k){ const open=sch.filter(e=>e.effectiveTo==null||e.effectiveTo===''); return open.length===1?open[0]:sch[sch.length-1]; }
  let hit=null;
  sch.forEach(e=>{ const f=cogsIsoKey(e.effectiveFrom);
    const t=(e.effectiveTo==null||e.effectiveTo==='')?null:cogsIsoKey(e.effectiveTo);
    if(f&&k>=f&&(t===null||k<=t))hit=e; });
  return hit;
}
function cogsIsLatestEntry(e,st){ const sch=cogsSchedule(st); return !!e&&!!sch&&e===sch[sch.length-1]; }

// ---- COST PRECEDENCE (Phase 2A, revision 2). Highest wins. ----
//  1. per-show override   sh.costs[sku]
//  2. the VALID dated schedule entry covering that date   <-- AUTHORITATIVE
//     (this now governs the open/current period too, not just closed ones)
//  3. legacy cost table  S.costs[sku]   -- compatibility fallback ONLY when no
//     valid schedule exists. It can never override a valid dated schedule.
//  4. SKUS built-in default
// A null date resolves to the open-ended entry.
function getCostOn(k,dateKey,sh,st){
  const state=st||(typeof S!=='undefined'?S:null)||{};
  if(sh&&sh.costs&&sh.costs[k]!=null&&sh.costs[k]!==''){ const v=parseFloat(sh.costs[k]); if(isFinite(v))return v; }
  const e=cogsEntryOn(dateKey,state);
  if(e&&e.costs&&e.costs[k]!=null)return parseFloat(e.costs[k])||0;
  const c=state.costs&&state.costs[k];
  if(c!=null&&c!=='')return parseFloat(c)||0;
  return (SKUS.find(x=>x.key===k)||{}).cost||0;
}
function costSourceOn(k,dateKey,sh,st){
  const state=st||(typeof S!=='undefined'?S:null)||{};
  if(sh&&sh.costs&&sh.costs[k]!=null&&sh.costs[k]!=='')return 'per-show override';
  const sch=cogsSchedule(state);
  if(sch&&!cogsValidate(sch).valid)return 'FALLBACK: schedule invalid';
  const e=cogsEntryOn(dateKey,state);
  if(e&&e.costs&&e.costs[k]!=null)return 'schedule: '+(e.id||'entry');
  if(sch)return 'FALLBACK: date not covered by any schedule period';
  const c=state.costs&&state.costs[k];
  if(c!=null&&c!=='')return 'cost table (no schedule present)';
  return 'SKUS default';
}
function showDayKey(sh,di){
  const st=cogsIsoKey(sh&&sh.startDate); if(!st)return null;
  const d=new Date(st+'T12:00:00'); d.setDate(d.getDate()+(parseInt(di,10)||0));
  return d.toISOString().slice(0,10);
}
function calcCOGSOn(units,dateKey,sh,st){
  return SKUS.reduce((t,s)=>t+((units[s.key]||0)*getCostOn(s.key,dateKey,sh,st)),0);
}

  const ldp=repShowLegacyDayPayout(sh,repId); if(ldp>0)return ldp;
  const ov=sh.repPayout&&sh.repPayout[repId]; if(ov!=null&&ov!=='')return parseFloat(ov)||0;
  return 0;
}
function showRepIds(sh){ const ids=new Set(); (sh.days||[]).forEach(d=>{ (d.repSales||[]).forEach(rs=>{ if(rs.repId)ids.add(rs.repId); }); Object.keys(d.repPay||{}).forEach(k=>ids.add(k)); Object.keys(d.repPayout||{}).forEach(k=>ids.add(k)); }); if(sh.repPayout)Object.keys(sh.repPayout).forEach(k=>ids.add(k)); return [...ids]; }
function showRepPayTotal(sh){ return showRepIds(sh).reduce((t,repId)=>t+repShowPay(sh,repId),0); }
// ---- Flat / hourly / manual workers (e.g. Olivia paid straight cash). Not commission-based reps. ----
// Each worker: {id,name,role,type:'flat'|'hourly'|'manual',hours,rate,amount,paid,payMethod,payNote}
const WORKER_TYPES=[{k:'flat',l:'Flat cash payout'},{k:'hourly',l:'Hourly payout'},{k:'manual',l:'Manual custom payout'}];
function workerPayout(w){ if(!w)return 0; if(w.type==='hourly')return (parseFloat(w.hours)||0)*(parseFloat(w.rate)||0); return parseFloat(w.amount)||0; }
function showWorkerPayouts(sh){ return (sh.workers||[]).reduce((t,w)=>t+workerPayout(w),0); }
function showWorkerPaid(sh){ return (sh.workers||[]).reduce((t,w)=>t+(parseFloat(w.paid)||0),0); }
function showWorkerOwed(sh){ return (sh.workers||[]).reduce((t,w)=>t+Math.max(0,workerPayout(w)-(parseFloat(w.paid)||0)),0); }
// Total of EVERY person's payout on a show: day-pay reps (incl. legacy payouts) + flat/hourly/manual workers
function showLaborTotal(sh){ return showRepPayTotal(sh)+showWorkerPayouts(sh); }
// Total $ a rep rang up across a show (all payment methods)
function repShowSales(sh,repId){ let t=0; (sh.days||[]).forEach(d=>(d.repSales||[]).forEach(rs=>{ if(rs.repId===repId)t+=PMTS.reduce((a,p)=>a+(parseFloat(rs[p.key])||0),0); })); return t; }
// Rep pay charged against ONE day: day pay entries for that day; legacy per-day payouts stay on
// their day; a legacy per-show payout is split evenly across days so day P&Ls still sum to the show.
function dayPayEffective(sh,di){
  const d=(sh.days||[])[di]; if(!d)return 0; let total=0;
  showRepIds(sh).forEach(repId=>{
    if(repShowDayPay(sh,repId)>0){ total+=repDayPay(d,repId); return; }
    if(repShowLegacyDayPayout(sh,repId)>0){ total+=repLegacyDayPayout(d,repId)||0; return; }
    const ov=sh.repPayout&&sh.repPayout[repId];
    if(ov!=null&&ov!==''){ total+=(parseFloat(ov)||0)/(((sh.days||[]).length)||1); }
  });
  return total;
}
function repEarned(repId,shId){ let total=0; (S.shows||[]).forEach(sh=>{ if(shId&&sh.id!==shId)return; total+=repShowPay(sh,repId); }); return total; }
function repPaid(repId,shId){
  const rep=(S.reps||[]).find(r=>r.id===repId);if(!rep)return 0;
  return (rep.payments||[]).filter(p=>!shId||p.showId===shId).reduce((t,p)=>t+(parseFloat(p.amount)||0),0);
}
function repOwed(repId,shId){return Math.max(0,repEarned(repId,shId)-repPaid(repId,shId));}
function allRepsOwed(){
  return (S.reps||[]).filter(r=>!r.isSelf&&r.active).map(r=>({rep:r,earned:repEarned(r.id),paid:repPaid(r.id),owed:repOwed(r.id)})).filter(x=>x.earned>0||x.owed>0);
}
function getShowDates(sh){
  // Returns array of YYYY-MM-DD dates this show occupies. Needs startDate.
  if(!sh.startDate)return[];
  const out=[];const s=new Date(sh.startDate+'T12:00:00');
  for(let i=0;i<(sh.numDays||1);i++){
    const d=new Date(s);d.setDate(d.getDate()+i);
    out.push(d.toISOString().split('T')[0]);
  }
  return out;
}

// ===== Multi-show helpers (Jul 2026): today's day index + deposit deadlines =====
function todayDayIndex(sh){
  const n=(sh.days||[]).length; if(!n)return 0;
  if(sh.startDate&&/^\d{4}-\d{2}-\d{2}$/.test(sh.startDate)){
    const i=Math.round((new Date(_todayKey()+'T12:00:00')-new Date(sh.startDate+'T12:00:00'))/86400000);
    if(i>=0&&i<n)return i; if(i>=n)return n-1; return 0;
  }
  for(let i=0;i<n;i++){const d=sh.days[i];if(!(d.morningCount&&d.eveningCount))return i;}
  return n-1;
}
function depositAlerts(withinDays){
  const today=_todayKey(); const out=[];
  (S.shows||[]).forEach(sh=>{
    if(sh.status==='completed'||isMissed(sh))return;
    if(!sh.depositDue||!/^\d{4}-\d{2}-\d{2}$/.test(sh.depositDue))return;
    const bal=boothBalance(sh); if(bal<=0)return;
    const days=Math.round((new Date(sh.depositDue+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);
    if(days<=withinDays)out.push({sh,due:sh.depositDue,days,bal});
  });
  return out.sort((a,b)=>a.days-b.days);
}

// ===== At-show stock (ported from Batman's app): live on-hand for active shows =====
function showOnHand(sh){
  const r={}; SKUS.forEach(s=>r[s.key]=0);
  if(!sh||sh.status!=='active')return r;            // only active shows hold stock out of the garage
  const days=sh.days||[];
  for(let i=days.length-1;i>=0;i--){ const d=days[i]; if(!d)continue;
    if(d.eveningCount){ SKUS.forEach(s=>r[s.key]=parseInt(d.eveningCount[s.key])||0); return r; }
    if(d.morningCount){ const rk=d.restock||{}; SKUS.forEach(s=>r[s.key]=(parseInt(d.morningCount[s.key])||0)+(parseInt(rk[s.key])||0)); return r; }
  }
  if(sh.packedInventory)SKUS.forEach(s=>r[s.key]=parseInt(sh.packedInventory[s.key])||0);
  return r;
}
function activeStockShows(){ return (S.shows||[]).filter(s=>s.status==='active'); }
function atShowsInv(){ const r={}; SKUS.forEach(s=>r[s.key]=0); activeStockShows().forEach(sh=>{ const o=showOnHand(sh); SKUS.forEach(s=>r[s.key]+=(o[s.key]||0)); }); return r; }

function showSortKey(sh){
  const mo={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
  if(sh.startDate&&/^\d{4}-\d{2}-\d{2}$/.test(sh.startDate))return sh.startDate;
  if(sh.dates&&sh.dates[0]){const m=sh.dates[0].match(/(\w{3})\s+(\d+)/);if(m&&mo[m[1]])return '2026-'+mo[m[1]]+'-'+String(m[2]).padStart(2,'0');}
  return sh.createdAt||'9999';
}

function calcBreakEven(sh){
  const mpg=S.settings.mpg||17.5;
  const gp=S.settings.gasPrice||3.50;
  const gas=showGas(sh);
  const showExp=(sh.showExpenses||[]).reduce((t,e)=>t+(parseFloat(e.amount)||0),0);
  const flatOverhead=(typeof showFlatOverhead==='function')?showFlatOverhead(sh):0; // candy + paper towels
  const workerPay=(typeof showWorkerPayouts==='function')?showWorkerPayouts(sh):0; // flat/hourly/manual workers are fixed labor
  // Rep day pay is flat labor too (no % of sales anymore) — whatever's been entered counts as a fixed cost.
  const repPay=(typeof showRepPayTotal==='function')?showRepPayTotal(sh):0;
  const fixedCosts=Math.max(sh.boothCost||0,(typeof boothPaid==='function')?boothPaid(sh):0)+gas+(sh.lodging||0)+showExp+flatOverhead+workerPay+repPay;
  // Variable-cost ratio: this show's own COGS-to-collected when it has data, else 30% (2025 season average)
  let ratio=0.30,cardShare=0.5;
  const g=showActualRev(sh);
  if(g>0){ let c=0;(sh.days||[]).forEach(d=>{if(d.morningCount&&d.eveningCount)c+=calcCOGS(dayCogsUnits(d));}); if(c>0)ratio=Math.min(0.6,c/g); cardShare=Math.min(1,showCardSales(sh)/g); }
  const denom=Math.max(0.2,1-ratio-((S.settings&&S.settings.sqFee)||0)*cardShare);
  const dollars=fixedCosts/denom;
  // Units: what does that mean at the table? Uses the show's own average sale per unit when known.
  const P=sh.prices||S.prices||{};
  let avg=SKUS.reduce((t,s)=>t+((P[s.key]!=null)?P[s.key]:getP(s.key)),0)/SKUS.length;
  const u=showUnitsSold(sh); const uT=SKUS.reduce((t,s)=>t+(u[s.key]||0),0);
  if(uT>0){ const pv=calcRev(u,sh.prices||null); if(pv>0)avg=pv/uT; }
  return {dollars,units:avg>0?Math.ceil(dollars/avg):0,ratio};
}

  <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Moves packed units from one show to another (e.g. one booth ran out). This is NOT a sale — revenue, units sold, and rep totals are untouched.</div>
  <div class="fg"><label class="fl">Product</label><select class="fi" id="tr_sku">${SKUS.map(s=>`<option value="${s.key}">${s.name}</option>`).join('')}</select></div>
  <div class="fg"><label class="fl">Quantity</label><input class="fi" type="number" id="tr_qty" placeholder="0" min="1" step="1" inputmode="numeric"></div>

  <div class="fg"><label class="fl">To Show</label><select class="fi" id="tr_to">${opt(toDefault)}</select></div>
  <button class="btn btn-gold btn-full" onclick="saveTransfer()">✅ Transfer</button>`);
}
function saveTransfer(){ if(_dupGuard())return;
  const sku=$$('tr_sku').value, qty=parseInt($$('tr_qty').value)||0;
  const fromId=$$('tr_from').value, toId=$$('tr_to').value;
  if(qty<=0){toast('Enter a quantity');return;}
  if(fromId===toId){toast('Pick two different shows');return;}
  const from=S.shows.find(s=>s.id===fromId), to=S.shows.find(s=>s.id===toId);
  if(!from||!to){toast('Show not found');return;}
  from.packedInventory=from.packedInventory||{}; to.packedInventory=to.packedInventory||{};
  const avail=from.packedInventory[sku]||0;
  if(qty>avail&&!confirm(`${from.name} only shows ${avail} packed. Transfer anyway?`))return;
  from.packedInventory[sku]=(from.packedInventory[sku]||0)-qty;
  to.packedInventory[sku]=(to.packedInventory[sku]||0)+qty;
  if(!S.transfers)S.transfers=[];
  S.transfers.push({id:'tr_'+Date.now(),ts:new Date().toISOString(),date:_todayKey(),sku,qty,fromShowId:fromId,fromName:from.name,toShowId:toId,toName:to.name});
  mClose();saveS();
  const sName=(SKUS.find(s=>s.key===sku)||{}).short||sku;
  toast(`🔄 Moved ${qty} ${sName}: ${from.name} → ${to.name}`);
}
function delTransfer(id){
  if(!S.transfers)return;
  const tr=S.transfers.find(x=>x.id===id);if(!tr)return;
  if(!confirm('Undo this transfer? Units move back from '+tr.toName+' to '+tr.fromName+'.'))return;
  const from=S.shows.find(s=>s.id===tr.fromShowId), to=S.shows.find(s=>s.id===tr.toShowId);
  if(from){from.packedInventory=from.packedInventory||{};from.packedInventory[tr.sku]=(from.packedInventory[tr.sku]||0)+tr.qty;}
  if(to){to.packedInventory=to.packedInventory||{};to.packedInventory[tr.sku]=(to.packedInventory[tr.sku]||0)-tr.qty;}
  S.transfers=S.transfers.filter(x=>x.id!==id);
  saveS();toast('Transfer undone');
}

function _csv(v){ if(v==null)v=''; v=String(v); return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function _csvRows(rows){ return rows.map(r=>r.map(_csv).join(',')).join('\r\n'); }
function _stamp(){ return _todayKey(); }
function dlFile(name,text,mime){
  try{
    const blob=new Blob([text],{type:(mime||'text/csv')+';charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},150);
    toast('📤 Saved '+name);
  }catch(e){ toast('Export failed'); }
}
function _slug(s){ return String(s||'show').replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-|-$/g,''); }

// Print-to-PDF via a Blob URL window (no document.write) — user picks "Save as PDF" in the print dialog.
function _printHTML(title,body){
  const doc='<!doctype html><html><head><meta charset="utf-8"><title>'+_esc(title)+'</title>'+
  '<style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;margin:24px;font-size:13px}h1{font-size:20px;margin:0 0 2px}h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #333;padding-bottom:3px}table{border-collapse:collapse;width:100%;margin:6px 0}td,th{border:1px solid #ccc;padding:5px 8px;text-align:left}th{background:#f0f0f0}.r{text-align:right}.muted{color:#666;font-size:11px}.tot{font-weight:800;background:#fafafa}@media print{.noprint{display:none}}</style>'+
  '</head><body>'+body+'<div class="noprint" style="margin-top:20px"><button onclick="window.print()" style="padding:10px 16px;font-size:14px">Print / Save as PDF</button></div>'+
  '<script>setTimeout(function(){window.print();},400);</'+'script></body></html>';
  const url=URL.createObjectURL(new Blob([doc],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(!w){ toast('Allow pop-ups to print / save PDF'); }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

// PRE-SHOW INVENTORY CALCULATOR (restored Jul 2026)
// "What am I bringing?" -> potential sales volume + potential over product cost, before any counts.
// ===================================================
function _psPrice(sh,k){ const P=sh&&sh.prices; return (P&&P[k]!=null)?P[k]:getP(k); }
function preShowStockOf(sh){
  if(sh.preShowStock&&Object.values(sh.preShowStock).some(v=>(parseInt(v)||0)>0))return sh.preShowStock;
  if(sh.packedInventory&&Object.values(sh.packedInventory).some(v=>(parseInt(v)||0)>0))return sh.packedInventory;
  return sh.preShowStock||{};
}
function preShowTotals(sh){
  const st=preShowStockOf(sh);
  let units=0,volume=0,cogs=0;
  SKUS.forEach(s=>{const q=parseInt(st[s.key])||0;units+=q;volume+=q*_psPrice(sh,s.key);cogs+=q*getCost(s.key);});
  return {st,units,volume,cogs,over:volume-cogs};
}
function preShowCalcHTML(sh){
  const {st,units,volume,cogs,over}=preShowTotals(sh);
  const usingPacked=!(sh.preShowStock&&Object.values(sh.preShowStock).some(v=>(parseInt(v)||0)>0)) && units>0;
  const rows=SKUS.map(s=>{const q=parseInt(st[s.key])||0;if(!q)return'';return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)"><span>${s.emoji} ${s.short} × <strong>${q}</strong></span><span style="color:var(--gold)">${fmt(q*_psPrice(sh,s.key))}</span></div>`;}).join('');
  return `<div class="card gb" style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;font-weight:800">🎒 Pre-Show Inventory Calculator</div>
      <button class="btn btn-gold btn-xs" onclick="openPreShowStock('${sh.id}')">${units>0?'✏️ Edit Stock':'+ Enter Stock'}</button>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:10px">Enter the stock you're bringing to this show to see what it could do — before you log a single count.${usingPacked?' <span style="color:var(--blue)">(showing packed inventory)</span>':''}</div>
    ${units>0?`
    <div class="g3" style="margin-bottom:10px">
      <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:var(--gold)">${fmtN(units)}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Units Bringing</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:var(--green)">${fmt(volume)}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Potential Sales</div></div>
      <div style="text-align:center"><div style="font-size:20px;font-weight:900;color:var(--blue)">${fmt(over)}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Over Product Cost</div></div>
    </div>
    ${rows}
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">
      <span>Cost of goods on this stock: <strong style="color:var(--text)">${fmt(cogs)}</strong></span>
      <span>at full sell-through</span>
    </div>`:`<div style="text-align:center;color:var(--muted);font-size:12px;padding:8px 0">No stock entered yet. Tap <strong style="color:var(--gold)">+ Enter Stock</strong> to project this show's potential.</div>`}
  </div>`;
}
function openPreShowStock(shId){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return;
  const st=sh.preShowStock||{};
  mOpen(`<div class="mh"><div class="mt">🎒 Stock You're Bringing</div><button class="mx" onclick="mClose()">×</button></div>

function savePreShowStock(shId){

function clearPreShowStock(shId){

      </div>

function openCloseout(shId,di){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return; const d=sh.days[di];if(!d)return;
  const hasM=!!d.morningCount, hasE=!!d.eveningCount, hasP=calcPmt(d.payments)>0;
  const staffed=(sh.repIds||[]).some(id=>{const r=(S.reps||[]).find(x=>x.id===id);return r&&r.active;});
  const dayTotal=calcPmt(d.payments);
  const carry=invCarryIssues(sh).filter(m=>m.di===di), neg=invNegativeSold(sh).filter(m=>m.di===di);
  const reconBad=(carry.length&&!d.carryReason)||neg.length>0;
  const reconOK=!carry.length&&!neg.length;
  const cc=dayCashCheck(sh,di);
  const cashLine=cc.state==='short'?(' · cash short '+fmt(cc.amt)+' vs product sold (ok if discounts)'):cc.state==='over'?(' · cash '+fmt(cc.amt)+' OVER — recheck counts'):cc.state==='ok'?' · cash matches inventory':'';
  const ic=v=>v===true?'✅':v==='opt'?'◽':'⬜';
  const step=(n,title,state,detail,btn)=>`<div style="display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)"><div style="font-size:17px;line-height:1.3">${ic(state)}</div><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13px">${n}. ${title}</div><div style="font-size:11px;color:var(--muted)">${detail}</div>${btn?`<div style="margin-top:6px">${btn}</div>`:''}</div></div>`;
  const canLock=hasE&&hasP&&!reconBad;
  const moneyBtn=`<button class="btn btn-xs ${hasP?'btn-ghost':'btn-gold'}" onclick="showMoneyModal('${sh.id}',${di})">${hasP?'Edit money':'Count money'}</button>`;
  mOpen(`<div class="mh"><div class="mt">🏁 Day Closeout</div><button class="mx" onclick="mClose()">×</button></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:10px">${sh.name} · ${d.date||('Day '+(di+1))}. Work top to bottom — reopen anytime to see what's left.</div>
  ${d.locked?`<div class="wb green" style="margin-bottom:10px">🔒 Finalized & locked. <button class="btn btn-xs btn-ghost" onclick="unlockDay('${sh.id}',${di});setTimeout(()=>openCloseout('${sh.id}',${di}),50)">Unlock to edit</button></div>`:''}
  ${step(1,'Evening count',hasE?true:false,hasE?'Counted — unsold product recorded.':'Count all unsold product at end of day.',`<button class="btn btn-xs ${hasE?'btn-ghost':'btn-gold'}" onclick="showCntModal('${sh.id}',${di},'evening')" ${!hasM?'disabled style="opacity:.5"':''}>${hasE?'Edit count':'Count now'}</button>${!hasM?' <span style="font-size:10px;color:var(--muted)">(do morning count first)</span>':''}`)}
  ${step(2,'Money',hasP?true:false,hasP?('Day total '+fmt(dayTotal)+(d.paymentsAuto?' · auto from old rep-sales data':'')):'Count the day\'s money — one total, by payment method.',moneyBtn)}
  ${step(3,'Day expenses',(d.expenses&&Object.values(d.expenses).some(v=>parseFloat(v)>0))?true:'opt','Gas, food, parking, hotel for the day (optional).',`<button class="btn btn-xs btn-ghost" onclick="showExpModal('${sh.id}',${di})">Edit expenses</button>`)}
  ${step(4,'Day pay — what each rep gets today',staffed?(calcDayPay(d)>0?true:false):'opt',staffed?(calcDayPay(d)>0?('Entered — '+fmt(calcDayPay(d))+' today.'):'Enter each rep\'s flat $ for this day before you close out.'):'No reps on this show. Workers are logged on the show page.',staffed?`<button class="btn btn-xs ${calcDayPay(d)>0?'btn-ghost':'btn-gold'}" onclick="openDayPay('${sh.id}',${di})">${calcDayPay(d)>0?'Edit day pay':'Enter day pay'}</button>`:`<button class="btn btn-xs btn-ghost" onclick="mClose();go('show','${sh.id}',${di})">Go to show</button>`)}
  ${step(5,'Reconciliation — inventory + cash',reconBad?false:(reconOK?true:'opt'),(reconBad?'⚠️ Inventory mismatch — fix before locking.':(reconOK?'Counts reconcile.':'Reviewed (override on file).'))+cashLine,reconBad?`<button class="btn btn-xs btn-gold" onclick="mClose();go('show','${sh.id}',${di})">Review mismatch</button>`:'')}
  ${(cc.state==='short'||cc.state==='over')?dayCashCheckHTML(sh,di,false):''}
  <div style="margin-top:14px">
    <button class="btn ${canLock&&!d.locked?'btn-gold':'btn-ghost'} btn-full" ${(!canLock||d.locked)?'disabled style="opacity:.5"':''} onclick="lockDay('${sh.id}',${di});mClose();go('show','${sh.id}',${di})">${d.locked?'🔒 Already finalized':'🔒 Finalize & Lock Day'}</button>
    ${(!canLock&&!d.locked)?`<div style="font-size:10px;color:var(--muted);text-align:center;margin-top:6px">${!hasE?'Need evening count. ':''}${!hasP?'Need a money total. ':''}${reconBad?'Resolve the inventory mismatch. ':''}</div>`:''}
  </div>`);
}

function showPackModal(shId){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return;
  mOpen(`<div class="mh"><div class="mt">🎒 Pack for ${sh.name}</div><button class="mx" onclick="mClose()">×</button></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px">How many are you bringing? Can't exceed master inventory.</div>
  ${SKUS.map(s=>`<div class="cr"><div class="cr-i"><div class="cr-n">${s.name}</div><div class="cr-s">In stock: ${S.inventory[s.key]||0}</div></div>
  <div class="cr-c"><button class="crb" onclick="pkA('${s.key}',-1)">−</button><input class="cri" type="number" id="pk_${s.key}" value="0" min="0" max="${S.inventory[s.key]||0}" oninput="updPackLeft()"><button class="crb" onclick="pkA('${s.key}',1)">+</button></div></div>`).join('')}
  <div id="pkLeft" style="font-size:11px;color:var(--muted);margin-top:10px;text-align:center"></div>
  <div style="display:flex;gap:10px;margin-top:12px">
    <button class="btn btn-ghost" style="flex:0 0 auto" onclick="pkAll('${shId}');updPackLeft()">Take All</button>
    <button class="btn btn-gold" style="flex:1" onclick="confirmPack('${shId}')">✅ Start Show</button>
  </div>`);
}
function pkA(k,d){const i=$$('pk_'+k);const m=S.inventory[k]||0;i.value=Math.max(0,Math.min(m,parseInt(i.value||0)+d));updPackLeft();}
function otherShowsNeedingStock(exceptId){
  const today=_todayKey();
  return (S.shows||[]).filter(sh=>{
    if(sh.id===exceptId||sh.status==='completed'||isMissed(sh))return false;
    if(sh.status==='active')return true;
    if(!sh.startDate||!/^\d{4}-\d{2}-\d{2}$/.test(sh.startDate))return false;
    const days=Math.round((new Date(sh.startDate+'T12:00:00')-new Date(today+'T12:00:00'))/86400000);
    return days>=0&&days<=7;
  });
}
function updPackLeft(){
  const el=$$('pkLeft'); if(!el)return;
  let taking=0; const left={};
  SKUS.forEach(s=>{const v=parseInt(($$('pk_'+s.key)||{}).value)||0;taking+=v;left[s.key]=(S.inventory[s.key]||0)-v;});
  const leftT=SKUS.reduce((t,s)=>t+Math.max(0,left[s.key]),0);
  el.innerHTML=taking>0?`Garage after this pack: <strong style="color:${leftT<20?'var(--red)':'var(--text)'}">${leftT} units</strong> (${SKUS.map(s=>s.short+' '+Math.max(0,left[s.key])).join(' · ')})`:'';
}
function pkAll(shId){SKUS.forEach(s=>{const i=$$('pk_'+s.key);if(i)i.value=S.inventory[s.key]||0;});}
function confirmPack(shId){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return;
  // Coverage check: warn when other shows this week still need garage stock
  (()=>{})();
  const others=otherShowsNeedingStock(shId);
  if(others.length){
    let taking=0,leftT=0; SKUS.forEach(s=>{const v=Math.min(parseInt(($$('pk_'+s.key)||{}).value)||0,S.inventory[s.key]||0);taking+=v;leftT+=(S.inventory[s.key]||0)-v;});
    if(taking>0&&typeof confirm==='function'&&!confirm('Heads up: '+others.map(o=>o.name).join(', ')+' also '+(others.length>1?'need':'needs')+' stock this week. After this pack the garage has '+leftT+' units left. Pack anyway?'))return;
  }
  const pk={};SKUS.forEach(s=>pk[s.key]=Math.min(parseInt($$('pk_'+s.key).value)||0,S.inventory[s.key]||0));
  SKUS.forEach(s=>S.inventory[s.key]=(S.inventory[s.key]||0)-pk[s.key]);
  sh.status='active';sh.packedInventory={...pk};sh.days[0].morningCount={...pk};if(!sh.prices)sh.prices=JSON.parse(JSON.stringify(S.prices||{})); // freeze prices so later price changes never rewrite this show's history
  mClose();saveS();toast('Show started! Inventory packed.');
}
function showCntModal(shId,di,type){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return;
  const d=sh.days[di];
  let def=eSku();
  if(type==='morning'){if(di>0&&sh.days[di-1].eveningCount)def={...sh.days[di-1].eveningCount};else if(d.morningCount)def={...d.morningCount};}
  else{def=d.eveningCount?{...d.eveningCount}:(d.morningCount?{...d.morningCount}:eSku());}
  const prevEve=(type==='morning'&&di>0)?(sh.days[di-1].eveningCount||null):null;
  mOpen(`<div class="mh"><div class="mt">${type==='morning'?'🌅 Morning Count':'🌙 Evening Count'}</div><button class="mx" onclick="mClose()">×</button></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${type==='morning'?'Count everything at your booth right now.':'Count all unsold items at end of day.'}</div>
  ${prevEve?`<div class="wb gold" style="margin-bottom:12px;font-size:12px">Opening should match <strong>last night's ending</strong>. Only change a number if you restocked or recounted — a mismatch gets flagged for reconciliation.</div>`:''}
  ${SKUS.map(s=>`<div class="cr"><div class="cr-i"><div class="cr-n">${s.name}</div>${type==='evening'&&d.morningCount?`<div class="cr-s">Started: ${d.morningCount[s.key]||0}</div>`:(prevEve?`<div class="cr-s">Last night: ${prevEve[s.key]||0}</div>`:'')}</div>
  <div class="cr-c"><button class="crb" onclick="cA('c_${s.key}',-1)">−</button><input class="cri" type="number" id="c_${s.key}" value="${def[s.key]||0}" min="0"><button class="crb" onclick="cA('c_${s.key}',1)">+</button></div></div>`).join('')}
  <button class="btn btn-gold btn-full" style="margin-top:12px" onclick="saveCount('${shId}',${di},'${type}')">Save ${type==='morning'?'Morning':'Evening'} Count</button>`);
}
function cA(id,d){const e=$$(id);e.value=Math.max(0,parseInt(e.value||0)+d);}
function saveCount(shId,di,type){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return;
  const d=sh.days[di];
  if(d.locked){ toast('🔒 Day is locked. Unlock it to edit.'); return; }
  const c={};SKUS.forEach(s=>c[s.key]=parseInt($$('c_'+s.key).value)||0);
  const before=(type==='morning'?d.morningCount:d.eveningCount)||null;
  const diffs=SKUS.filter(s=>(before?(before[s.key]||0):null)!==(c[s.key]||0)).map(s=>`${s.short}:${before?(before[s.key]||0):'—'}→${c[s.key]||0}`);
  if(type==='morning')d.morningCount=c;
  else{d.eveningCount=c;if(di<sh.days.length-1&&!sh.days[di+1].morningCount)sh.days[di+1].morningCount={...c};}
  invLogPush(sh,{ts:new Date().toISOString(),di,date:d.date,type:type+' count',changes:diffs.length?diffs:['(no change)'],by:'owner'});
  // Cross-day continuity check on a morning entry — flag if it doesn't match last night's ending
  let warn='';
  if(type==='morning'&&di>0&&sh.days[di-1].eveningCount){
    const mm=SKUS.some(s=>(sh.days[di-1].eveningCount[s.key]||0)!==(c[s.key]||0));
    if(mm){ d.carryReason=null; warn=' ⚠️ Does NOT match last night — see Reconciliation.'; }
  }
  mClose();saveS();toast((type==='morning'?'Morning count saved!':'Evening count saved!')+warn);
}
function lockDay(shId,di){ const sh=S.shows.find(s=>s.id===shId);if(!sh)return; const d=sh.days[di];if(!d)return; d.locked=true; d.lockTs=new Date().toISOString(); invLogPush(sh,{ts:d.lockTs,di,date:d.date,type:'lock',changes:['day finalized/locked'],by:'owner'}); saveS();toast('🔒 Day finalized'); }
function unlockDay(shId,di){ const sh=S.shows.find(s=>s.id===shId);if(!sh)return; const d=sh.days[di];if(!d)return; const reason=(typeof prompt==='function')?prompt('Reason for unlocking this finalized day?'):'unlocked'; if(reason===null)return; d.locked=false; invLogPush(sh,{ts:new Date().toISOString(),di,date:d.date,type:'unlock',changes:['unlocked: '+(reason||'(no reason)')],by:'owner'}); saveS();toast('🔓 Day unlocked'); }
function reconcileCarry(shId,di){ const sh=S.shows.find(s=>s.id===shId);if(!sh)return; const d=sh.days[di];if(!d)return; const reason=(typeof prompt==='function')?prompt('Explain the change from last night (e.g. restocked 12 C5S, recounted, damaged/lost):'):'reviewed'; if(reason===null)return; d.carryReason=reason||'(reviewed)'; invLogPush(sh,{ts:new Date().toISOString(),di,date:d.date,type:'reconcile',changes:['override accepted: '+d.carryReason],by:'owner'}); saveS();toast('✅ Reconciliation noted'); }
function fixCarryFromPrev(shId,di){ const sh=S.shows.find(s=>s.id===shId);if(!sh)return; const d=sh.days[di],prev=sh.days[di-1]; if(!prev||!prev.eveningCount)return; d.morningCount={...prev.eveningCount}; d.carryReason=null; invLogPush(sh,{ts:new Date().toISOString(),di,date:d.date,type:'autofix',changes:['opening reset to last night ending'],by:'owner'}); saveS();toast('✅ Opening reset to last night ending'); }
// Per-day restock (units brought in) + damaged/lost/given (units that left but earned no money). Option A: lost units still count as COGS.
function openAdjustModal(shId,di){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return; const d=sh.days[di];if(!d)return;
  if(d.locked){toast('🔒 Day locked. Unlock to edit.');return;}
  const rk=d.restock||{},ls=d.lost||{};
  mOpen(`<div class="mh"><div class="mt">± Restock / Damaged-Lost-Given</div><button class="mx" onclick="mClose()">×</button></div>

  const pk=sh.packedInventory||null, sold=showUnitsSold(sh), ret={};
  SKUS.forEach(s=>{

  });
  return ret;

  shows.forEach(sh=>{
    const s=new Date(sh.startDate+'T08:00:00');

    const stamp=fmt8(new Date());
    const boothNote='Booth: '+(sh.boothCost?'$'+sh.boothCost.toFixed(2):'TBD')+' | '+( sh.numDays||1)+' day(s) | '+(sh.confirmed?'CONFIRMED':'PENDING');

    ics+='DTSTAMP:'+stamp+CRLF;
    ics+='DTSTART:'+fmt8(s)+CRLF;

    ics+='LOCATION:'+(sh.location||'')+CRLF;
    ics+='DESCRIPTION:'+boothNote+CRLF;

  });

  a.href=url;a.download='BestSolution_Shows_2026.ics';

// CALENDAR (month grid view)
// ===================================================
function calShift(delta){
  if(!calMonth){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()};}
  let m=calMonth.m+delta,y=calMonth.y;
  if(m<0){m=11;y--;}
  if(m>11){m=0;y++;}
  calMonth={y,m};
  rCalendar();
}
function calToday(){
  const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()};
  rCalendar();
}
function rCalendar(){
  if(!calMonth){const n=new Date();calMonth={y:n.getFullYear(),m:n.getMonth()};}
  const y=calMonth.y,m=calMonth.m;
  const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW=['S','M','T','W','T','F','S'];
  const startDow=new Date(y,m,1).getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayStr=_todayKey();
  const mKey=y+'-'+String(m+1).padStart(2,'0');
  const dayMap={};
  S.shows.forEach(sh=>{getShowDates(sh).forEach(ds=>{(dayMap[ds]=dayMap[ds]||[]).push(sh);});});
  let monthDays=0;
  Object.keys(dayMap).forEach(ds=>{if(ds.substring(0,7)===mKey)monthDays++;});
  let h=`<div class="cal-hdr"><button class="cal-nav-btn" onclick="calShift(-1)">&lsaquo;</button><div class="cal-title">${MN[m]} ${y}</div><button class="cal-nav-btn" onclick="calShift(1)">&rsaquo;</button></div>`;
  h+='<div class="cal-grid">';
  DOW.forEach(d=>h+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++)h+='<div class="cal-cell blank"></div>';
  let conflictDays=0;
  for(let day=1;day<=daysInMonth;day++){
    const ds=`${mKey}-${String(day).padStart(2,'0')}`;
    const shows=dayMap[ds]||[];
    const conflict=shows.length>1;
    if(conflict)conflictDays++;
    let cls='cal-cell',onclick='';
    if(ds===todayStr)cls+=' today';
    if(shows.length){
      let st='possible';
      if(shows.some(s=>s.status==='completed'))st='completed';
      else if(shows.some(s=>s.confirmed||s.status==='active'))st='confirmed';
      cls+=` has-show ${st}`;
      if(conflict)cls+=' conflict';
      onclick=` onclick="go('show','${shows[0].id}')"`;
    }
    h+=`<div class="${cls}"${onclick}><div class="cal-num">${day}${conflict?' <span style="color:var(--red);font-size:10px">⚠️</span>':''}</div>`;
    shows.slice(0,2).forEach(s=>{h+=`<div class="cal-show-pill">${s.repOnlyShow?'👥 ':''}${s.name}</div>`;});
    if(shows.length>2)h+=`<div class="cal-show-pill">+${shows.length-2} more</div>`;
    h+='</div>';
  }
  h+='</div>';
  h+=`<div class="cal-legend"><span><span class="cal-legend-dot" style="background:var(--green)"></span>Booked</span><span><span class="cal-legend-dot" style="background:var(--gold)"></span>Pending</span><span><span class="cal-legend-dot" style="background:rgba(0,210,106,0.55)"></span>Completed</span><span><span class="cal-legend-dot" style="background:var(--red)"></span>⚠️ Conflict</span></div>`;
  h+=`<div style="text-align:center;font-size:12px;color:var(--muted);margin-top:10px">${monthDays} show day${monthDays===1?'':'s'} in ${MN[m]}${conflictDays?` · <span style="color:var(--red);font-weight:700">${conflictDays} conflict day${conflictDays>1?'s':''}</span>`:''}</div>`;
  h+=`<button class="btn btn-ghost btn-full" style="margin-top:12px" onclick="calToday()">Jump to This Month</button>`;
  h+=`<button class="btn btn-ghost btn-full" style="margin-top:8px" onclick="exportCalICS()">Export Shows to Calendar (.ics)</button>`;
  pg('calendar').innerHTML=h;
}

  let h='';
  h+=`<div class="sec-row"><div class="sec-title">🧴 Supplies</div><button class="btn btn-gold btn-sm" onclick="openOtherExpense('Supplies')">💰 Log Purchase</button></div>
  ${supSpend>0?`<div class="wb gold" style="margin-bottom:8px">YTD supply spend: <strong>${fmt(supSpend)}</strong></div>`:'<div style="font-size:12px;color:var(--muted);margin-bottom:8px">No supply purchases logged yet. Hit Log Purchase after a Target/Walmart run.</div>'}`;
  if(low.length>0){
    h+=`<div class="wb red" style="margin-bottom:10px">⚠️ ${low.length} item${low.length>1?'s':''} LOW — restock before next show</div>`;

  } else {
    sup.forEach((s,i)=>{

      const cost=parseFloat(s.cost)||0;
      const autoLbl=(s.autoSizes&&s.autoSizes.length)?s.autoSizes.map(k=>{const sk=SKUS.find(x=>x.key===k);return sk?sk.short:k;}).join('/'):'';
      h+=`<div class="cr">

          <div class="cr-n" style="${isLow?'color:var(--red)':''}">${s.name}</div>
          <div class="cr-s">${isLow?'⚠️ LOW · ':''}<span style="color:var(--muted)">min ${s.low} ${s.unit||'ea'}${cost>0?' · '+fmt(cost)+'/ea':''}${autoLbl?' · 🎁 '+autoLbl:''}</span></div>
        </div>

          <button class="crb" onclick="adjSup(${i},-1)">−</button>

          <button onclick="openSupEdit(${i})" style="background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px;margin-left:2px" title="Cost & give-away settings">⚙️</button>
          <button onclick="delSup(${i})" style="background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px" title="Delete">🗑</button>

  h+='</div>';
  h+=`<div class="sec-lbl">ADD ITEM</div>
  <div class="card">
    <div class="fg"><label class="fl">ITEM NAME</label><input class="fi" id="sup-new-name" placeholder="e.g. Small lacy bag"></div>
    <div class="g2" style="gap:8px;margin-bottom:11px">
      <div><label class="fl">QUANTITY</label><input class="fi" id="sup-new-qty" type="number" min="0" placeholder="0" style="font-size:16px"></div>
      <div><label class="fl">LOW ALERT AT</label><input class="fi" id="sup-new-low" type="number" min="0" placeholder="2" style="font-size:16px"></div>
    </div>
    <div class="g2" style="gap:8px;margin-bottom:11px">
      <div><label class="fl">UNIT (optional)</label><input class="fi" id="sup-new-unit" placeholder="ea, roll, bag…"></div>
      <div><label class="fl">COST $/UNIT</label><input class="fi" id="sup-new-cost" type="number" min="0" step="0.001" placeholder="0.00" style="font-size:16px"></div>
    </div>

    <button class="btn btn-gold btn-full" onclick="addSupItem()">+ ADD ITEM</button>

function saveSupEdit(i){

function saveSupplyUse(shId){

function adjSup(i,delta){
  if(!S.supplies||!S.supplies[i])return;
  S.supplies[i].qty=Math.max(0,(S.supplies[i].qty||0)+delta);
  saveS();
}
function setSup(i,val){
  if(!S.supplies||!S.supplies[i])return;
  S.supplies[i].qty=Math.max(0,parseInt(val)||0);
  saveS();
}
function delSup(i){
  if(!S.supplies)return;
  const name=S.supplies[i]?S.supplies[i].name:'item';
  if(!confirm('Delete '+name+'?'))return;
  S.supplies.splice(i,1);

function addSupItem(){
  const name=($$('sup-new-name').value||'').trim();

  const qty=parseInt($$('sup-new-qty').value)||0;
  const low=parseInt($$('sup-new-low').value)||2;

  const costRaw=($$('sup-new-cost')||{}).value; const cost=(costRaw==null||costRaw==='')?null:(parseFloat(costRaw)||0);

  S.supplies.push({id:'sup_'+Date.now(),name,qty,low,unit,cost,autoSizes:[]});

function repWorkedShows(repId){ return (S.shows||[]).filter(sh=>(sh.repIds||[]).includes(repId)||repShowSales(sh,repId)>0||repShowDayPay(sh,repId)>0||(sh.repPayout&&sh.repPayout[repId]!=null)); }
function rReps(){
  const reps=[...(S.reps||[])].filter(r=>r.active).sort((a,b)=>(b.isSelf?1:0)-(a.isSelf?1:0));
  let h=`<div class="sec-title" style="margin-bottom:4px">👥 Sales Reps</div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Tap a rep for their full breakdown — shows worked, sales, and what they're owed.</div>`;
  // ---- Payouts Due board: every daily-pay rep + flat/hourly/manual worker who is still owed money ----
  (()=>{
    const repDebts=reps.filter(r=>!r.isSelf).map(r=>({r,owed:Math.max(0,repEarned(r.id)-repPaid(r.id))})).filter(x=>x.owed>0.005);
    const workerDebts=[]; (S.shows||[]).forEach(sh=>(sh.workers||[]).forEach(w=>{const owed=Math.max(0,workerPayout(w)-(parseFloat(w.paid)||0));if(owed>0.005)workerDebts.push({sh,w,owed});}));
    const grand=repDebts.reduce((t,x)=>t+x.owed,0)+workerDebts.reduce((t,x)=>t+x.owed,0);
    if(!repDebts.length&&!workerDebts.length){ if(reps.some(r=>!r.isSelf))h+=`<div class="card" style="margin-bottom:12px;border-color:rgba(0,210,106,0.3)"><div style="font-size:12px;color:var(--green);font-weight:700">✓ Everyone's paid up — no payouts due.</div></div>`; return; }
    const row=(name,sub,owed,btn)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)"><div style="min-width:0"><div style="font-weight:700;font-size:13px">${name}</div><div style="font-size:10px;color:var(--muted)">${sub}</div></div><div style="display:flex;align-items:center;gap:8px;flex-shrink:0"><span style="color:var(--gold);font-weight:800">${fmt(owed)}</span>${btn}</div></div>`;
    h+=`<div class="card" style="border-color:var(--gold);margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div style="font-size:10px;color:var(--gold);text-transform:uppercase;font-weight:700">💸 Payouts Due</div><div style="font-size:16px;font-weight:900;color:var(--gold)">${fmt(grand)}</div></div>
      ${repDebts.map(x=>row(x.r.name,'sales rep · paid per day',x.owed,`<button class="btn btn-xs btn-gold" onclick="openLogRepPmt('${x.r.id}')">Pay</button>`)).join('')}
      ${workerDebts.map(x=>row((x.w.name||'Worker').replace(/</g,'&lt;'),x.sh.name.replace(/</g,'&lt;')+' · '+(((WORKER_TYPES.find(t=>t.k===x.w.type)||{}).l)||'flat'),x.owed,`<button class="btn btn-xs btn-gold" onclick="openEditWorker('${x.sh.id}','${x.w.id}')">Pay</button>`)).join('')}
    </div>`;
  })();
  if(!reps.length){ h+='<div class="empty"><div class="ei">👥</div><div>No reps yet.</div></div>'; }
  reps.forEach(r=>{
    const earned=repEarned(r.id),paid=repPaid(r.id),owed=Math.max(0,earned-paid);
    const worked=repWorkedShows(r.id);
    h+=`<div class="card" style="margin-bottom:8px;cursor:pointer" onclick="openRepProfile('${r.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:800;font-size:15px">${r.name}${r.isSelf?' 👑':''}</div>
        <div style="font-size:11px;color:var(--muted)">${worked.length} show${worked.length!==1?'s':''} ›</div>
      </div>
      ${r.isSelf?`<div style="font-size:12px;color:var(--muted);margin-top:4px">Owner — paid by show profit</div>`:`
      <div class="g3" style="margin-top:8px">
        <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--green)">${fmt(earned)}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Earned</div></div>
        <div style="text-align:center"><div style="font-size:15px;font-weight:900;color:var(--gold)">${fmt(owed)}</div><div style="font-size:10px;color:var(--muted);text-transform:uppercase">Owed</div></div>

      </div>`}
    </div>`;
  });
  h+=`<button class="btn btn-gold btn-full" style="margin-top:4px" onclick="openAddRep()">+ Add Rep</button>`;
  pg('reps').innerHTML=h;
}

function saveRepDayPay(shId,repId){
  const sh=S.shows.find(s=>s.id===shId);if(!sh)return;
  const rep=(S.reps||[]).find(r=>r.id===repId);
  (sh.days||[]).forEach((d,i)=>{ const el=$$('rdp_'+i); if(!el)return; if(!d.repPay)d.repPay={}; const v=(el.value||'').trim(); if(v==='')delete d.repPay[repId]; else d.repPay[repId]=parseFloat(v)||0; });
  // once day pay exists, retire any legacy per-show payout so it can't double up
  if(repShowDayPay(sh,repId)>0&&sh.repPayout)delete sh.repPayout[repId];
  if(!sh.repPayMeta)sh.repPayMeta={};
  const method=($$('ep_method')||{}).value||''; const note=(($$('ep_note')||{}).value||'').trim();
  if(method||note)sh.repPayMeta[repId]={method,note}; else delete sh.repPayMeta[repId];
  // optional: log an actual payment attributed to this show
  const paid=parseFloat(($$('ep_paid')||{}).value);
  if(paid&&paid>0&&rep){
    if(!rep.payments)rep.payments=[];
    const dup=rep.payments.find(p=>p.showId===sh.id&&Math.abs((parseFloat(p.amount)||0)-paid)<0.005);
    if(!dup||(typeof confirm==='function'&&confirm('⚠️ '+fmt(paid)+' is ALREADY logged as paid for this show. Log it AGAIN as a second payment?')))
      rep.payments.push({id:'rp_'+Date.now(),date:_todayKey(),amount:paid,note:note||('Day pay — '+sh.name),method,showId:sh.id});
    else toast('Skipped duplicate payment log');
  }
  mClose();saveS();toast('✅ Day pay saved · '+fmt(repShowPay(sh,repId))+' this show');renderCur();
}

function applyClaudeCmd(){
  const raw=($$('claudeCmd').value||'').trim().toUpperCase();
  if(!raw){toast('Nothing to apply!');return;}
  try{
    // INVENTORY UPDATE: INV:32oz=80,c5s=400
    if(raw.startsWith('INV:')){
      const parts=raw.replace('INV:','').split(',');
      let updated=0;
      parts.forEach(p=>{
        const [k,v]=p.split('=');
        const key=k.trim().toLowerCase();
        const val=parseInt(v);
        const sku=SKUS.find(s=>s.key===key||s.short.toLowerCase()===key||s.name.toLowerCase().includes(key));
        if(sku&&!isNaN(val)){S.inventory[sku.key]=Math.max(0,val);updated++;}
      });
      if(updated>0){$$('claudeCmd').value='';saveS();toast('✅ Updated '+updated+' inventory items!');go('stock');}
      else{toast('No valid items found. Check the format.');}
      return;
    }
    // ADD INVENTORY: ADD:32oz=10,c5s=50
    if(raw.startsWith('ADD:')){
      const parts=raw.replace('ADD:','').split(',');
      let updated=0;
      parts.forEach(p=>{
        const [k,v]=p.split('=');
        const key=k.trim().toLowerCase();
        const val=parseInt(v);
        const sku=SKUS.find(s=>s.key===key||s.short.toLowerCase()===key||s.name.toLowerCase().includes(key));
        if(sku&&!isNaN(val)){S.inventory[sku.key]=(S.inventory[sku.key]||0)+val;updated++;}
      });
      if(updated>0){$$('claudeCmd').value='';saveS();toast('✅ Added stock to '+updated+' items!');go('stock');}
      else{toast('No valid items found. Check the format.');}
      return;
    }
    // SUBTRACT INVENTORY: SOLD:32oz=5,c5s=10
    if(raw.startsWith('SOLD:')){
      const parts=raw.replace('SOLD:','').split(',');
      let updated=0;
      parts.forEach(p=>{
        const [k,v]=p.split('=');
        const key=k.trim().toLowerCase();
        const val=parseInt(v);
        const sku=SKUS.find(s=>s.key===key||s.short.toLowerCase()===key||s.name.toLowerCase().includes(key));
        if(sku&&!isNaN(val)){S.inventory[sku.key]=Math.max(0,(S.inventory[sku.key]||0)-val);updated++;}
      });
      if(updated>0){$$('claudeCmd').value='';saveS();toast('✅ Removed sold items from '+updated+' SKUs!');go('stock');}
      else{toast('No valid items found. Check the format.');}
      return;
    }
    toast('Unknown command. Start with INV:, ADD:, or SOLD:');
  }catch(e){toast('Command error: '+e.message);}
}

async function cloudHydrate(){
  const cloud=await cloudPull();

  if(!cloud.inventory||!cloud.shows){await cloudPush();return;}
  const localUsed=looksUsed(S),cloudUsed=looksUsed(cloud);
  if(localUsed&&!cloudUsed){await cloudPush();return;}
  if(cloudUsed&&!localUsed){adoptCloud(cloud);return;}
  const localT=S._updatedAt||'',cloudT=cloud._updatedAt||'';
  if(cloudT>localT){ if(!looksUsed(S)||(typeof confirm!=='function')||confirm('Cloud has a NEWER copy than this device. Load it and replace this device\'s local data? (A local backup is kept either way.)'))adoptCloud(cloud); else await cloudPush(); }
  else if(localT>cloudT){
    // SAFETY GUARD: never silently overwrite a richer cloud copy with a fresh/empty device.
    const cloudDone=(cloud.shows||[]).filter(x=>x&&x.status==='completed').length;
    const localDone=(S.shows||[]).filter(x=>x&&x.status==='completed').length;
    if(cloudDone>localDone){

  }
  else setSync('synced');
}

// app version and does not have to match BX_BUILD.version. Bump the URL number

function bxNum(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function bxNow(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }
function bxISO(){ return new Date().toISOString(); }
function bxFingerprint(o){ // cheap stable hash so snapshot differences are visible
  const s=JSON.stringify(o); let h=5381;
  for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
  return ('00000000'+h.toString(16)).slice(-8)+'/'+s.length;
}
// ---- Snapshot-bound calculation engine ------------------------------------
// Every figure in every export file is derived through bxView(state). Nothing
// here reads the live S, and no app calc helper is called, so the export is a
// faithful picture of the SELECTED snapshot rather than of current memory.
// SKUS / PMTS / SHOWS_2025 are build-time code constants, not mutable state.
function bxView(st){
  const A=st||{}, set=A.settings||{}, V={state:A,settings:set};
  const N=bxNum;

// ---- Cloud read with an honest, non-lossy result ----
// The app's own cloudPull() returns null for BOTH "no row" and "Supabase error",
// so it cannot tell an empty cloud from a failed read. This does its own
// read-only SELECT (identical query) and reports which of the four it was.
// status: 'ok' | 'empty' | 'error' | 'signed_out'
async function bxCloudRead(){
  const R=(status,state,message)=>({status:status,state:state,message:message});
  if(typeof sb==='undefined'||!sb)
    return R('signed_out',null,'cloud sync is not set up on this device');
  if(typeof _cloudUser==='undefined'||!_cloudUser)
    return R('signed_out',null,'not signed in to cloud sync');
  let res;
  try{
    res=await sb.from('app_data').select('data_value').eq('data_key','bs_state').maybeSingle();
  }catch(e){
    return R('error',null,'cloud read failed: '+String((e&&e.message)||e));
  }
  if(!res)
    return R('error',null,'cloud read failed: no response from Supabase');
  if(res.error)
    return R('error',null,'cloud read failed: '+String(res.error.message||res.error.code||JSON.stringify(res.error)));
  const val=res.data?res.data.data_value:null;
  if(val==null)
    return R('empty',null,'no cloud state returned (nothing saved to the cloud for this account yet)');
  if(typeof val!=='object'||!val.shows)
    return R('empty',null,'no cloud state returned (the cloud row exists but holds no usable app data)');
  return R('ok',val,'read OK');
}

  r=[['show_id','show_name','date','day_num','open','close','status'].concat(PMTS.map(p=>p.label),['day_total','has_counts'])];
  shows.forEach(sh=>(sh.days||[]).forEach(d=>{
    r.push([sh.id,sh.name,d.date||'',d.dayNum||'',d.openTime||'',d.closeTime||'',d.status||'']
      .concat(PMTS.map(p=>bxNum((d.payments||{})[p.key]).toFixed(2)),
        [V.pmtTotal(d.payments).toFixed(2),V.dayHasCounts(d)?'yes':'NO'])); }));
  put('02_sales_by_day_payment.csv',r);

  r=[['show_id','show_name','date','sku','morning_count','restock','evening_count','lost','units_sold','unit_price','unit_cost','revenue','cogs']];
  shows.forEach(sh=>(sh.days||[]).forEach(d=>{ if(!V.dayHasCounts(d))return;
