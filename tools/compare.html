<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Best Solution Compare</title>
<style>
:root{--bg:#111;--card:#1c1c1c;--text:#f2f2f2;--muted:#9a9a9a;--gold:#FFD600;--green:#00D26A;--red:#ff5c5c}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,system-ui,sans-serif;padding:16px}
h1{color:var(--gold);font-size:20px;margin:4px 0}
.card{background:var(--card);border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}
button{font-size:16px;font-weight:800;padding:12px;border-radius:10px;border:0;background:var(--gold);color:#000;width:100%;margin-top:8px}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.45}
.m{color:var(--muted);font-size:13px}
</style></head><body>
<h1>Best Solution: Compare Two Copies</h1>
<div class="m">READ ONLY. Works offline. This page never saves anything, never touches the app's data on this device, and never talks to the cloud.</div>
<div class="card"><b>A</b> (e.g. the Sep 30 Desktop backup)<br><input type="file" id="fa" accept=".json,application/json"><div class="m" id="ha"></div></div>
<div class="card"><b>B</b> (e.g. the cloud snapshot)<br><input type="file" id="fb" accept=".json,application/json"><div class="m" id="hb"></div></div>
<button onclick="go()">Compare</button>
<button onclick="save()" style="background:#333;color:#fff">Download report (.txt)</button>
<div class="card"><pre id="out">Pick both files, then tap Compare.</pre></div>
<script src="bs-compare.js"></script>
<script>
var TXT='';
function readFile(inp){return new Promise(function(ok,bad){var f=inp.files&&inp.files[0];if(!f)return bad(new Error('pick a file for '+inp.id));
  var r=new FileReader();r.onload=function(){ok({name:f.name,size:f.size,text:r.result});};r.onerror=function(){bad(r.error);};r.readAsText(f);});}
async function sha(t){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0');}).join('');}
function unwrap(o){ // accept a raw app backup, or a cloud snapshot file {data_value,...}
  if(o&&o.data_value&&o.data_value.shows)return o.data_value; return o; }
async function go(){
  var out=document.getElementById('out');
  try{
    var a=await readFile(document.getElementById('fa')),b=await readFile(document.getElementById('fb'));
    var A=unwrap(JSON.parse(a.text)),B=unwrap(JSON.parse(b.text));
    var hA=await sha(a.text),hB=await sha(b.text);
    document.getElementById('ha').textContent=a.name+' · '+a.size+' bytes · SHA-256 '+hA;
    document.getElementById('hb').textContent=b.name+' · '+b.size+' bytes · SHA-256 '+hB;
    var rep=bsCompare.compare(A,B,{labelA:a.name+' ('+a.size+' bytes, sha256 '+hA.slice(0,16)+'…)',labelB:b.name+' ('+b.size+' bytes, sha256 '+hB.slice(0,16)+'…)'});
    TXT=bsCompare.toText(rep); out.textContent=TXT;
  }catch(e){ out.textContent='Could not compare: '+(e&&e.message||e); }
}
function save(){ if(!TXT){alert('Compare first');return;}
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([TXT],{type:'text/plain'}));
  a.download='best-solution-compare-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.txt';document.body.appendChild(a);a.click();a.remove(); }
</script>
</body></html>
